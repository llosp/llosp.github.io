<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SKRILL — Metas da Temporada</title>
  <link rel="icon" type="image/x-icon" href="/skrill/favicon.ico"/>
  <link rel="stylesheet" href="/skrill/css/style.css"/>
</head>
<body>
  <div class="orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
  <div class="app-layout">
    <div id="sidebar-root"></div>
    <main class="main-content">
      <div class="page-inner">
        <div id="app" class="center-screen"><div class="spinner"></div></div>
      </div>
    </main>
    <div id="mobile-nav-root"></div>
  </div>

  <!-- Modal nova meta -->
  <div id="modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-title" style="gap:8px"><img src="/skrill/img/goals.svg" alt="goals" style="width:24px;height:24px"> Nova Meta</div>
      <form id="goal-form" onsubmit="handleAddGoal(event)">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Dificuldade</label>
            <div class="difficulty-pills">
              <label class="diff-pill active" id="diff-simple-label">
                <input type="radio" name="goal-difficulty" value="simple" checked/>
                <span>Simples · 2pts</span>
              </label>
              <label class="diff-pill" id="diff-complex-label">
                <input type="radio" name="goal-difficulty" value="complex"/>
                <span>Complexa · 5pts</span>
              </label>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Título</label>
            <input id="goal-title" class="form-input" type="text" placeholder="O que você vai conquistar?" required maxlength="120"/>
          </div>
          <div class="form-group">
            <label class="form-label">Descrição <span class="text-muted">(opcional)</span></label>
            <textarea id="goal-desc" class="form-input" placeholder="Mais detalhes..."></textarea>
          </div>
          <div id="goal-error" class="form-error hidden"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
          <button type="submit" id="goal-submit" class="btn btn-primary">Declarar Meta</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal entrega -->
  <div id="delivery-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-title" style="gap:8px"><img src="/skrill/img/goals.svg" alt="goals" style="width:24px;height:24px"> Entregar Meta</div>
      <div class="modal-body">
        <div id="delivery-goal-title" style="font-size:24px;font-weight:700;margin-bottom:14px;color:var(--text)"></div>
        <div class="form-group">
          <label class="form-label">Prova de entrega <span style="color:var(--amber)">*</span></label>
          <input id="delivery-files" class="form-input" type="file" multiple accept="image/*" required style="padding:8px"/>
          <div style="font-size:20px;color:var(--text-muted);margin-top:4px">Selecione uma ou mais imagens como comprovante</div>
        </div>
        <div id="delivery-error" class="form-error hidden"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeDeliveryModal()">Cancelar</button>
        <button type="button" id="delivery-submit" class="btn btn-primary" onclick="submitDelivery()">Confirmar Entrega</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/skrill/js/client.js"></script>
  <script>
  if (!isAppUnlocked()) { window.location.href = '/skrill/login/'; }
  else if (!getStoredProfile()) { window.location.href = '/skrill/select-profile/'; }

  let currentProfile  = null;
  let currentWeek     = null;
  let allGoals        = [];
  let isParticipating = false;
  let pendingGoalId   = null;

  async function init() {
    const stored = requireAuth();
    if (!stored) return;

    const [{ data: profile }, { data: week }] = await Promise.all([
      sb.from('profiles').select('*').eq('id', stored.id).single(),
      sb.from('weeks').select('*').eq('is_current', true).single(),
    ]);

    currentProfile = profile;
    currentWeek    = week;
    if (profile) setStoredProfile(profile);

    document.getElementById('sidebar-root').innerHTML = renderSidebar(profile, 'weekly');
    document.getElementById('mobile-nav-root').innerHTML = renderMobileNav('weekly');

    if (week) {
      const [{ data: goals }, { data: part }] = await Promise.all([
        sb.from('goals').select('*, profile:profiles(*)')
          .eq('week_id', week.id)
          .order('created_at', { ascending: false }),
        sb.from('season_participants').select('id')
          .eq('week_id', week.id).eq('profile_id', profile.id).maybeSingle(),
      ]);
      allGoals = goals ?? [];
      isParticipating = !!part;
    }

    renderPage();
  }

  function renderPage() {
    const app = document.getElementById('app');
    app.classList.remove('center-screen');
    const week       = currentWeek;
    const myGoals    = allGoals.filter(g => g.profile_id === currentProfile?.id);
    const otherGoals = allGoals.filter(g => g.profile_id !== currentProfile?.id);
    const revealed   = currentWeek?.skrill_time_revealed ?? false;

    if (!week) {
      app.innerHTML = `<div style="width:100%">
        <div class="page-header">
          <div>
            <div class="page-header-label" style="display:flex;align-items:center;gap:8px"><img src="/skrill/img/goals.svg" alt="goals" style="width:24px;height:24px"> Metas da Temporada</div>
            <h1 class="page-header-title">Metas da Temporada</h1>
          </div>
        </div>
        ${renderNoWeekBanner()}
      </div>`;
      return;
    }

    if (!isParticipating) {
      app.innerHTML = renderSeasonLocked(week, currentProfile, '[G] Metas da Temporada', 'Metas da Temporada');
      return;
    }

    let weekLabel = `Temporada ${week.week_number}`;
    const s = new Date(week.start_date);
    const e = new Date(week.end_date);
    const weekSub = ` · ${s.toLocaleDateString('pt-BR',{month:'short',day:'numeric'})} – ${e.toLocaleDateString('pt-BR',{month:'short',day:'numeric'})}`;

    app.innerHTML = `
      <div style="width:100%">
        <div class="page-header">
          <div>
            <div class="page-header-label" style="display:flex;align-items:center;gap:8px"><img src="/skrill/img/goals.svg" alt="goals" style="width:24px;height:24px"> Metas da Temporada</div>
            <h1 class="page-header-title">${weekLabel}<span class="page-header-sub">${weekSub}</span></h1>
          </div>
          ${revealed ? '' : `<button class="btn btn-primary" onclick="openModal()">+ Declarar Meta</button>`}
        </div>

        <div class="tab-list">
          <button class="tab-btn active" data-tab="tab-all"    onclick="switchTab('tab-all')">
            Todas <span class="tab-count">${allGoals.length}</span>
          </button>
          <button class="tab-btn" data-tab="tab-mine"   onclick="switchTab('tab-mine')">
            Minhas <span class="tab-count">${myGoals.length}</span>
          </button>
          <button class="tab-btn" data-tab="tab-others" onclick="switchTab('tab-others')">
            Outros <span class="tab-count">${otherGoals.length}</span>
          </button>
        </div>

        <div id="tab-all"    class="tab-panel active">${renderGoals(allGoals, null, revealed)}</div>
        <div id="tab-mine"   class="tab-panel">${renderGoals(myGoals, true, revealed)}</div>
        <div id="tab-others" class="tab-panel">${renderGoals(otherGoals, false, revealed)}</div>
      </div>`;
  }

  function renderGoals(goals, isOwnerAll, revealed) {
    if (!goals.length) return `<div class="empty-state"><div class="empty-icon"><img src="/skrill/img/goals.svg" alt="goals" style="width:48px;height:48px"></div><h3>Nenhuma meta ainda</h3><p>Seja o primeiro a declarar uma!</p></div>`;
    return goals.map(g => renderGoalCard(g, isOwnerAll ?? (g.profile_id === currentProfile?.id), revealed)).join('');
  }

  function renderGoalCard(g, isOwner, revealed) {
    const profile = g.profile;
    const isDone  = g.status === 'completed';
    const imgs    = g.image_urls ?? [];
    const deleteBtn = isOwner
      ? `<button class="btn btn-sm btn-ghost" style="color:var(--text-muted);margin-left:auto" onclick="deleteGoal('${g.id}')">Excluir</button>`
      : '';
    const actions = isOwner && g.status === 'active'
      ? `<div class="goal-actions">
          <button class="btn btn-sm btn-success" onclick="openDeliveryModal('${g.id}')">Concluir</button>
          ${deleteBtn}
        </div>`
      : isOwner ? `<div class="goal-actions">${deleteBtn}</div>` : '';
    const imagesHTML = isDone && imgs.length
      ? `<div class="delivery-images" style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px">
          ${imgs.map(u => `<img class="delivery-img${revealed ? '' : ' blurred'}" src="${u}" alt="entrega">`).join('')}
        </div>`
      : '';
    return `
      <div class="goal-card ${g.status === 'completed' ? 'completed' : ''}" id="goal-${g.id}">
        <div class="goal-card-top">
          ${profile ? avatarHTML(profile) : ''}
          <div class="goal-card-meta">
            <div class="goal-user-row">
              ${profile ? `<span class="goal-username">${profile.name}</span>` : ''}
              <span class="goal-time">${timeAgo(g.created_at)}</span>
            </div>
            <div class="goal-title ${isDone ? 'done' : g.status === 'failed' ? 'failed' : ''}">${g.title}</div>
            ${g.description ? `<div class="goal-desc">${g.description}</div>` : ''}
          </div>
        </div>
        ${imagesHTML}
        <div class="goal-footer">
          ${difficultyChip(g.difficulty)}
          ${statusBadge(g.status, g.points_earned)}
          ${actions}
        </div>
      </div>`;
  }

  async function handleAddGoal(e) {
    e.preventDefault();
    const title = document.getElementById('goal-title').value.trim();
    const desc  = document.getElementById('goal-desc').value.trim();
    const difficulty = document.querySelector('input[name="goal-difficulty"]:checked')?.value || 'simple';
    const basePts = difficulty === 'complex' ? 5 : 2;
    const btn   = document.getElementById('goal-submit');
    const errEl = document.getElementById('goal-error');
    errEl.classList.add('hidden');
    btn.disabled = true; btn.textContent = '...';

    try {
      const { data: newGoal, error } = await sb
        .from('goals')
        .insert({
          profile_id:  currentProfile.id,
          week_id:     currentWeek?.id,
          title,
          description: desc || null,
          status:      'active',
          difficulty,
          points_earned: basePts,
        })
        .select('*, profile:profiles(*)')
        .single();

      if (error) { errEl.textContent = error.message; errEl.classList.remove('hidden'); return; }

      allGoals.unshift(newGoal);
      closeModal();
      renderPage();
    } finally {
      btn.disabled = false; btn.textContent = 'Declarar Meta';
    }
  }

  function openDeliveryModal(goalId) {
    pendingGoalId = goalId;
    const goal = allGoals.find(g => g.id === goalId);
    document.getElementById('delivery-goal-title').textContent = goal?.title ?? '';
    document.getElementById('delivery-files').value = '';
    document.getElementById('delivery-error').classList.add('hidden');
    document.getElementById('delivery-modal').classList.remove('hidden');
  }

  function closeDeliveryModal() {
    document.getElementById('delivery-modal').classList.add('hidden');
    pendingGoalId = null;
  }

  async function submitDelivery() {
    const filesInput = document.getElementById('delivery-files');
    const errEl      = document.getElementById('delivery-error');
    const btn        = document.getElementById('delivery-submit');
    errEl.classList.add('hidden');

    if (!filesInput.files.length) {
      errEl.textContent = 'Selecione pelo menos uma imagem.';
      errEl.classList.remove('hidden');
      return;
    }

    btn.disabled = true; btn.textContent = 'Enviando...';

    try {
      const urls = [];
      for (const file of filesInput.files) {
        const path = `${pendingGoalId}/${Date.now()}-${file.name}`;
        const { error: upErr } = await sb.storage.from('deliveries').upload(path, file);
        if (upErr) throw upErr;
        const { data: pub } = sb.storage.from('deliveries').getPublicUrl(path);
        urls.push(pub.publicUrl);
      }

      const { error: updErr } = await sb.from('goals').update({
        status:       'completed',
        completed_at: new Date().toISOString(),
        image_urls:   urls,
      }).eq('id', pendingGoalId);

      if (updErr) throw updErr;

      allGoals = allGoals.map(g => g.id === pendingGoalId
        ? { ...g, status: 'completed', image_urls: urls, completed_at: new Date().toISOString() }
        : g);

      closeDeliveryModal();
      renderPage();
    } catch (err) {
      errEl.textContent = err.message ?? 'Erro ao enviar. Tente novamente.';
      errEl.classList.remove('hidden');
    } finally {
      btn.disabled = false; btn.textContent = 'Confirmar Entrega';
    }
  }

  async function deleteGoal(goalId) {
    if (!confirm('Excluir esta meta?')) return;
    await sb.from('goals').delete().eq('id', goalId);
    allGoals = allGoals.filter(g => g.id !== goalId);
    renderPage();
  }

  function openModal() {
    document.getElementById('goal-title').value = '';
    document.getElementById('goal-desc').value  = '';
    document.getElementById('goal-error').classList.add('hidden');
    document.querySelector('input[name="goal-difficulty"][value="simple"]').checked = true;
    updateDiffPills();
    document.getElementById('modal').classList.remove('hidden');
    setTimeout(() => document.getElementById('goal-title').focus(), 50);
  }
  function closeModal() { document.getElementById('modal').classList.add('hidden'); }
  function updateDiffPills() {
    const v = document.querySelector('input[name="goal-difficulty"]:checked')?.value;
    document.getElementById('diff-simple-label').classList.toggle('active', v === 'simple');
    document.getElementById('diff-complex-label').classList.toggle('active', v === 'complex');
  }
  document.addEventListener('change', e => {
    if (e.target?.name === 'goal-difficulty') updateDiffPills();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeDeliveryModal(); } });

  init();
  </script>
</body>
</html>

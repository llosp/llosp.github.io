<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SKRILL — Acesso</title>
  <link rel="icon" type="image/x-icon" href="/skrill/favicon.ico"/>
  <link rel="stylesheet" href="/skrill/css/style.css"/>
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <div class="window">
        <div class="window-title">
          <span>SKRILL — Acesso</span>
        </div>
        <div class="window-body" style="padding:24px 28px 28px">

          <div style="display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:28px">
            <div class="skrill-sprite skrill-sprite-lg"></div>
            <div style="font-family:'Jersey 25',monospace;font-size:32px;color:#000;letter-spacing:0.04em">SKRILL</div>
            <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em">Guild. Build. Grow.</div>
          </div>

          <form id="auth-form" onsubmit="handleSubmit(event)">
            <div class="form-group">
              <label class="form-label">Senha do App</label>
              <input id="app-password" class="form-input" type="password" placeholder="••••••••" required autocomplete="off"/>
            </div>
            <div id="error-msg" class="form-error hidden">Senha incorreta. Tente novamente.</div>
            <button type="submit" id="submit-btn" class="btn btn-primary btn-full">Entrar</button>
          </form>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/skrill/js/client.js"></script>
  <script>
    if (isAppUnlocked()) {
      const p = getStoredProfile();
      window.location.href = p ? '/skrill/dashboard/' : '/skrill/select-profile/';
    }

    function handleSubmit(e) {
      e.preventDefault();
      const val  = document.getElementById('app-password').value;
      const btn  = document.getElementById('submit-btn');
      const errEl = document.getElementById('error-msg');
      errEl.classList.add('hidden');

      if (val === APP_PASSWORD) {
        btn.disabled = true;
        btn.textContent = '...';
        unlockApp();
        window.location.href = '/skrill/select-profile/';
      } else {
        errEl.classList.remove('hidden');
        document.getElementById('app-password').value = '';
        document.getElementById('app-password').focus();
      }
    }
  </script>
</body>
</html>

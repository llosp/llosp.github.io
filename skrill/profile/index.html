<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SKRILL — Perfil</title>
  <link rel="icon" type="image/x-icon" href="/skrill/favicon.ico"/>
  <link rel="stylesheet" href="/skrill/css/style.css"/>
</head>
<body>
  <div class="orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
  <div class="app-layout">
    <div id="sidebar-root"></div>
    <main class="main-content">
      <div class="page-inner">
        <div id="app" class="center-screen"><div class="spinner"></div></div>
      </div>
    </main>
    <div id="mobile-nav-root"></div>
  </div>

  <!-- Edit Profile Modal -->
  <div id="edit-modal" class="modal-overlay hidden">
    <div class="modal" style="max-width:560px;width:90vw">
      <div class="modal-title" style="gap:8px"><img src="/skrill/img/Profile.svg" alt="profile" style="width:24px;height:24px"> Editar Perfil</div>
      <div class="modal-body" style="padding:16px 20px 8px">
        <div class="form-group">
          <label class="form-label">Nome / Apelido</label>
          <input id="edit-name" class="form-input" type="text" maxlength="30" autocomplete="off"/>
        </div>
        <div class="form-group">
          <label class="form-label">Foto de Perfil</label>
          <div style="display:flex;flex-direction:column;align-items:center;gap:12px">
            <div style="display:flex;gap:8px;align-items:center;width:100%;max-width:min(500px,calc(100vw - 64px))">
              <button type="button" id="edit-btn-black" onclick="editSelectColor(true)"
                style="padding:6px 14px;border:2px solid #000;cursor:pointer;font-family:'Micro 5',monospace;font-size:24px;font-weight:bold;text-transform:uppercase;background:#000;color:#fff;box-shadow:2px 2px 0 #555;">
                Preto
              </button>
              <button type="button" id="edit-btn-white" onclick="editSelectColor(false)"
                style="padding:6px 14px;border:2px solid #A0A0A0;cursor:pointer;font-family:'Micro 5',monospace;font-size:24px;font-weight:bold;text-transform:uppercase;background:#fff;color:#555;box-shadow:2px 2px 0 #A0A0A0;">
                Branco
              </button>
              <button type="button" onclick="editClearCanvas()"
                style="margin-left:auto;padding:6px 12px;border:2px solid var(--border-dark);cursor:pointer;font-family:'Micro 5',monospace;font-size:24px;background:var(--surface);color:var(--text);box-shadow:2px 2px 0 var(--border-dark);text-transform:uppercase;">
                Limpar
              </button>
            </div>
            <div style="display:flex;align-items:flex-start;gap:10px;width:100%;max-width:min(500px,calc(100vw - 64px))">
              <div class="pixel-canvas-wrap" style="flex:1;min-width:0">
                <canvas id="edit-pixel-canvas" style="display:block;width:100%;image-rendering:pixelated;user-select:none;"></canvas>
              </div>
              <div style="display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:2px">
                <span style="font-family:'Micro 5',monospace;font-size:24px;color:var(--text-muted)">15</span>
                <input type="range" id="edit-brush-slider" min="2" max="15" value="2" step="1"
                  style="writing-mode:vertical-lr;direction:rtl;width:24px;height:140px;cursor:pointer;accent-color:#000;">
                <span style="font-family:'Micro 5',monospace;font-size:24px;color:var(--text-muted)">2</span>
                <div id="edit-brush-label" style="font-family:'Micro 5',monospace;font-size:24px;font-weight:bold;margin-top:6px">2px</div>
              </div>
            </div>
          </div>
        </div>
        <div id="edit-error" class="form-error hidden"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeEditModal()">Cancelar</button>
        <button class="btn btn-primary" id="edit-save-btn" onclick="saveProfile()">Salvar</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/skrill/js/bounties.js"></script>
  <script src="/skrill/js/client.js"></script>
  <script>
  if (!isAppUnlocked()) { window.location.href = '/skrill/login/'; }
  else if (!getStoredProfile()) { window.location.href = '/skrill/select-profile/'; }

  let viewedProfile    = null;
  let completedGoals   = [];
  let allProfileGoals  = [];
  let timelineLimit    = 4;

  async function init() {
    const stored = requireAuth();
    if (!stored) return;

    const targetId = new URLSearchParams(location.search).get('id') || stored.id;

    const [
      { data: me },
      { data: profile },
      { data: goals },
    ] = await Promise.all([
      sb.from('profiles').select('*').eq('id', stored.id).single(),
      sb.from('profiles').select('*').eq('id', targetId).single(),
      sb.from('goals').select('*, week:weeks(*)').eq('profile_id', targetId).order('created_at', { ascending: false }),
    ]);

    if (me) setStoredProfile(me);

    document.getElementById('sidebar-root').innerHTML = renderSidebar(me, 'profile');
    document.getElementById('mobile-nav-root').innerHTML = renderMobileNav('profile');

    if (!profile) {
      document.getElementById('app').innerHTML = `<div class="empty-state"><h3>Membro não encontrado</h3></div>`;
      return;
    }

    viewedProfile = profile;
    const isMe = profile.id === stored.id;
    completedGoals  = (goals ?? []).filter(g => g.status === 'completed');
    allProfileGoals = goals ?? [];

    document.getElementById('app').innerHTML = `
      <div style="width:100%">
        <div class="profile-hero">
          <!-- shared: avatar + name always in a row -->
          <div class="profile-hero-head">
            ${avatarHTML(profile, 'avatar-xl')}
            <div class="profile-hero-identity">
              <div class="profile-display">${profile.name}</div>
              <!-- desktop: stats horizontal row -->
              <div class="profile-stats-row profile-desktop-only">
                <div class="profile-stat"><div class="profile-stat-val">${(profile.total_points ?? 0).toLocaleString()}</div><div class="profile-stat-lbl">Total Pts</div></div>
                <div class="profile-stat"><div class="profile-stat-val">${completedGoals.length}</div><div class="profile-stat-lbl">Metas Feitas</div></div>
                <div class="profile-stat"><div class="profile-stat-val">${profile.streak_current ?? 0}<img src="/skrill/img/streak.svg" alt="streak" style="width:18px;height:18px;vertical-align:middle;position:relative;top:-2px;margin-left:2px"></div><div class="profile-stat-lbl">Streak</div></div>
                <div class="profile-stat"><div class="profile-stat-val">${profile.streak_longest ?? 0}<img src="/skrill/img/streak.svg" alt="streak" style="width:18px;height:18px;vertical-align:middle;position:relative;top:-2px;margin-left:2px"></div><div class="profile-stat-lbl">Melhor</div></div>
              </div>
              <!-- mobile: buttons inline below name -->
              ${isMe ? `
                <div class="profile-hero-actions profile-mobile-only">
                  <button class="btn btn-sm btn-primary" onclick="openEditModal()">Editar Perfil</button>
                  <button class="btn btn-sm btn-ghost" onclick="signOut()">Trocar Perfil</button>
                </div>
              ` : ''}
            </div>
            <!-- desktop: buttons column on far right -->
            ${isMe ? `
              <div class="profile-desktop-only profile-hero-btns-desktop">
                <button class="btn btn-sm btn-primary" onclick="openEditModal()">Editar Perfil</button>
                <button class="btn btn-sm btn-ghost" onclick="signOut()">Trocar Perfil</button>
              </div>
            ` : ''}
          </div>
          <!-- mobile: stat grids below the head row -->
          <div class="profile-mobile-only" style="flex-direction:column;gap:8px">
            <div class="profile-stat-grid-2">
              <div class="stat-card" style="padding:12px 8px"><div class="stat-value">${(profile.total_points ?? 0).toLocaleString()}</div><div class="stat-label">Total Pts</div></div>
              <div class="stat-card" style="padding:12px 8px"><div class="stat-value">${completedGoals.length}</div><div class="stat-label">Metas</div></div>
            </div>
            <div class="profile-stat-grid-2">
              <div class="stat-card" style="padding:12px 8px"><div class="stat-value">${profile.streak_current ?? 0}<img src="/skrill/img/streak.svg" alt="streak" style="width:18px;height:18px;vertical-align:middle;position:relative;top:-2px;margin-left:2px"></div><div class="stat-label">Streak</div></div>
              <div class="stat-card" style="padding:12px 8px"><div class="stat-value">${profile.streak_longest ?? 0}<img src="/skrill/img/streak.svg" alt="streak" style="width:18px;height:18px;vertical-align:middle;position:relative;top:-2px;margin-left:2px"></div><div class="stat-label">Melhor</div></div>
            </div>
          </div>
        </div>

        <div class="tab-list">
          <button class="tab-btn active" data-tab="tab-timeline" onclick="switchTab('tab-timeline')">Temporadas</button>
          <button class="tab-btn" data-tab="tab-gallery" onclick="switchTab('tab-gallery')">Galeria</button>
          <button class="tab-btn" data-tab="tab-evo" onclick="switchTab('tab-evo');renderEvoTab()">Stats</button>
        </div>
        <div id="tab-timeline" class="tab-panel active"></div>
        <div id="tab-gallery" class="tab-panel"></div>
        <div id="tab-evo" class="tab-panel"></div>
      </div>`;

    timelineLimit = 4;
    renderTimeline();
    document.getElementById('tab-gallery').innerHTML  = renderGallery();
  }

  function groupByWeek(goals) {
    const byWeek = new Map();
    for (const g of goals) {
      const wid = g.week_id ?? 'sem-semana';
      if (!byWeek.has(wid)) byWeek.set(wid, { wid, week: g.week, goals: [] });
      byWeek.get(wid).goals.push(g);
    }
    return [...byWeek.values()];
  }

  function weekLabel(week) {
    return week ? `Temporada ${week.week_number} · ${week.year}` : 'Sem temporada';
  }

  function goalCardHTML(g) {
    const revealed = g.week?.skrill_time_revealed ?? false;
    const imgs = g.image_urls ?? [];
    const imagesHTML = imgs.length
      ? `<div class="delivery-images">
          ${imgs.map(u => `<img class="delivery-img${revealed ? '' : ' blurred'}" src="${u}" alt="entrega">`).join('')}
        </div>`
      : '';
    return `
      <div class="goal-card completed">
        <div class="goal-card-top">
          <div class="goal-card-meta">
            <div class="goal-user-row"><span class="goal-time">${formatDate(g.created_at)}</span></div>
            <div class="goal-title done">${g.title}</div>
            ${g.description ? `<div class="goal-desc">${g.description}</div>` : ''}
          </div>
        </div>
        ${imagesHTML}
        <div class="goal-footer">
          ${difficultyChip(g.difficulty)}
          ${statusBadge(g.status, g.points_earned)}
        </div>
      </div>`;
  }

  let timelineObserver = null;

  function renderTimelinePanel() {
    if (!completedGoals.length) return `<div class="empty-state"><div class="empty-icon"><img src="/skrill/img/goals.svg" alt="goals" style="width:48px;height:48px"></div><h3>Nenhuma meta ainda</h3></div>`;

    const sections = groupByWeek(completedGoals);
    const nodes = sections.map((s, i) =>
      `<button class="timeline-node${i === 0 ? ' active' : ''}" data-season="${s.wid}" onclick="jumpToSeason('${s.wid}')">
        <span class="timeline-dot"></span>
        <span class="timeline-node-label">${weekLabel(s.week)}</span>
      </button>`
    ).join('');

    let shown = 0;
    const body = [];
    for (const s of sections) {
      if (shown >= timelineLimit) break;
      const slice = s.goals.slice(0, timelineLimit - shown);
      shown += slice.length;
      body.push(`
        <div class="week-section" id="season-${s.wid}">
          <div class="week-section-header">${weekLabel(s.week)}</div>
          ${slice.map(goalCardHTML).join('')}
        </div>`);
    }

    const moreBtn = completedGoals.length > timelineLimit
      ? `<button class="btn btn-ghost" style="width:100%;margin-top:12px" onclick="loadMoreTimeline()">Carregar mais</button>`
      : '';

    return `
      <div class="profile-timeline-layout">
        <nav class="timeline-rail">${nodes}</nav>
        <div>
          <div class="profile-timeline">${body.join('')}</div>
          ${moreBtn}
        </div>
      </div>`;
  }

  function setActiveNode(weekId) {
    document.querySelectorAll('.timeline-node').forEach(n =>
      n.classList.toggle('active', n.dataset.season === weekId)
    );
  }

  function markActiveOnScroll() {
    timelineObserver?.disconnect();
    timelineObserver = new IntersectionObserver(entries => {
      const visible = entries.filter(e => e.isIntersecting)
        .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
      if (visible) setActiveNode(visible.target.id.replace('season-', ''));
    }, { rootMargin: '0px 0px -60% 0px' });
    document.querySelectorAll('.week-section').forEach(el => timelineObserver.observe(el));
  }

  function renderTimeline() {
    document.getElementById('tab-timeline').innerHTML = renderTimelinePanel();
    markActiveOnScroll();
  }

  function loadMoreTimeline() {
    timelineLimit += 4;
    renderTimeline();
  }

  function jumpToSeason(weekId) {
    const sections = groupByWeek(completedGoals);
    let acc = 0;
    for (const s of sections) {
      acc += s.goals.length;
      if (s.wid === weekId) break;
    }
    timelineLimit = Math.max(timelineLimit, acc);
    renderTimeline();
    setActiveNode(weekId);
    document.getElementById('season-' + weekId)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function renderGallery() {
    const items = [];
    for (const g of completedGoals) {
      const revealed = g.week?.skrill_time_revealed ?? false;
      for (const u of (g.image_urls ?? [])) items.push({ url: u, revealed });
    }
    if (!items.length) return `<div class="empty-state"><div class="empty-icon"><img src="/skrill/img/image.svg" alt="galeria" style="width:48px;height:48px"></div><h3>Nenhuma imagem ainda</h3></div>`;
    return `<div class="profile-gallery">${items.map(it =>
      `<img class="delivery-img${it.revealed ? '' : ' blurred'}" src="${it.url}" alt="entrega">`
    ).join('')}</div>`;
  }

  function renderEvoTab() {
    const goals     = allProfileGoals;
    const total     = goals.length;
    const completed = goals.filter(g => g.status === 'completed').length;
    const failed    = goals.filter(g => g.status === 'failed').length;

    // ── stat cards ────────────────────────────────────────────────────────────
    const statCards = `
      <div class="stats-grid" style="margin-bottom:16px">
        <div class="stat-card"><div class="stat-value">${total}</div><div class="stat-label">Metas Criadas</div></div>
        <div class="stat-card"><div class="stat-value">${completed}</div><div class="stat-label">Metas Completas</div></div>
        <div class="stat-card"><div class="stat-value">${failed}</div><div class="stat-label">Metas Falhadas</div></div>
      </div>`;

    // ── aggregate by season ───────────────────────────────────────────────────
    const seasonMap = new Map();
    for (const g of goals) {
      if (!g.week) continue;
      const key = `${g.week.year}-${String(g.week.week_number).padStart(3,'0')}`;
      if (!seasonMap.has(key)) {
        seasonMap.set(key, { week_number: g.week.week_number, year: g.week.year, completed: 0, failed: 0, attempted: 0, pts: 0 });
      }
      const s = seasonMap.get(key);
      if      (g.status === 'completed') { s.completed++; s.pts += g.points_earned ?? 0; }
      else if (g.status === 'attempted') { s.attempted++; s.pts += g.points_earned ?? 0; }
      else                               { s.failed++; }
    }
    const seasons = [...seasonMap.entries()]
      .sort(([a],[b]) => a < b ? -1 : 1)
      .map(([,v]) => v)
      .slice(-8);

    const CHART_H  = 120;
    const noData   = `<div style="font-family:'Micro 5',monospace;font-size:24px;color:var(--text-muted);margin:auto">Sem dados</div>`;

    // ── grid lines helper ─────────────────────────────────────────────────────
    function gridLines(maxVal, h) {
      if (!maxVal) return '';
      const step = Math.max(1, Math.ceil(maxVal / 4));
      let out = '';
      for (let v = step; v <= maxVal + 0.01; v += step) {
        const val = Math.min(Math.round(v), maxVal);
        const bottom = Math.round(val / maxVal * h);
        out += `<div class="evo-grid-line" style="bottom:${bottom}px"><span class="evo-grid-lbl">${val}</span></div>`;
      }
      return out;
    }

    // ── chart 1: metas por temporada ─────────────────────────────────────────
    const maxGoals = seasons.length ? Math.max(...seasons.map(s => s.completed + s.failed + s.attempted), 1) : 1;
    const goalBars = seasons.map(s => {
      const hG = s.completed ? Math.round(s.completed / maxGoals * CHART_H) : 0;
      const hR = s.failed    ? Math.round(s.failed    / maxGoals * CHART_H) : 0;
      const hA = s.attempted ? Math.round(s.attempted / maxGoals * CHART_H) : 0;
      return `
        <div class="evo-bar-col">
          <div class="evo-bar-group">
            ${hG ? `<div class="evo-bar green" style="height:${hG}px" title="Completas: ${s.completed}"></div>` : ''}
            ${hR ? `<div class="evo-bar red"   style="height:${hR}px" title="Falhas: ${s.failed}"></div>` : ''}
            ${hA ? `<div class="evo-bar amber" style="height:${hA}px" title="Tentativas: ${s.attempted}"></div>` : ''}
          </div>
          <div class="evo-bar-lbl">T${s.week_number}</div>
        </div>`;
    }).join('');

    const chartMetas = `
      <div class="card" style="margin-bottom:14px">
        <div class="card-header"><div class="card-title">Metas por Temporada</div></div>
        <div class="card-body" style="padding:14px">
          ${seasons.length
            ? `<div class="evo-chart-outer"><div class="evo-chart">${gridLines(maxGoals, CHART_H)}${goalBars}</div></div>`
            : `<div style="height:80px;display:flex;align-items:center;justify-content:center">${noData}</div>`}
          <div class="evo-legend">
            <div class="evo-legend-item"><div class="evo-legend-swatch" style="background:var(--green-dark)"></div> Completas</div>
            <div class="evo-legend-item"><div class="evo-legend-swatch" style="background:var(--red)"></div> Falhas</div>
            <div class="evo-legend-item"><div class="evo-legend-swatch" style="background:var(--amber)"></div> Tentativas</div>
          </div>
        </div>
      </div>`;

    // ── chart 2: pontos por temporada ─────────────────────────────────────────
    const maxPts  = seasons.length ? Math.max(...seasons.map(s => s.pts), 1) : 1;
    const ptsBars = seasons.map(s => {
      const h = s.pts ? Math.max(4, Math.round(s.pts / maxPts * CHART_H)) : 4;
      return `
        <div class="evo-bar-col">
          <div class="evo-bar-val">${s.pts || ''}</div>
          <div class="evo-bar amber single" style="height:${h}px" title="${s.pts}pts"></div>
          <div class="evo-bar-lbl">T${s.week_number}</div>
        </div>`;
    }).join('');

    const chartPts = `
      <div class="card" style="margin-bottom:14px">
        <div class="card-header"><div class="card-title">Pontos por Temporada</div></div>
        <div class="card-body" style="padding:14px">
          ${seasons.length
            ? `<div class="evo-chart-outer"><div class="evo-chart">${gridLines(maxPts, CHART_H)}${ptsBars}</div></div>`
            : `<div style="height:80px;display:flex;align-items:center;justify-content:center">${noData}</div>`}
        </div>
      </div>`;

    // ── chart 3: dificuldade ──────────────────────────────────────────────────
    const simples  = goals.filter(g => g.difficulty === 'simple').length;
    const complexa = goals.filter(g => g.difficulty === 'complex').length;
    const extra    = goals.filter(g => g.difficulty === 'extra').length;
    const diffTot  = simples + complexa + extra;
    const simpPct  = diffTot > 0 ? Math.round(simples  / diffTot * 100) : 0;
    const compPct  = diffTot > 0 ? Math.round(complexa / diffTot * 100) : 0;
    const extraPct = diffTot > 0 ? Math.round(extra    / diffTot * 100) : 0;

    const chartDiff = `
      <div class="card" style="margin-bottom:14px">
        <div class="card-header"><div class="card-title">Dificuldade</div></div>
        <div class="card-body" style="padding:14px">
          ${diffTot === 0 ? noData : `
          <div class="evo-hbar-wrap">
            <div class="evo-hbar-row">
              <div class="evo-hbar-label"><span>Simples · ${simples} metas</span><span>${simpPct}%</span></div>
              <div class="evo-hbar-track"><div class="evo-hbar-fill blue" style="width:${simpPct}%"></div></div>
            </div>
            <div class="evo-hbar-row">
              <div class="evo-hbar-label"><span>Complexa · ${complexa} metas</span><span>${compPct}%</span></div>
              <div class="evo-hbar-track"><div class="evo-hbar-fill purple" style="width:${compPct}%"></div></div>
            </div>
            ${extra > 0 ? `<div class="evo-hbar-row">
              <div class="evo-hbar-label"><span>Extra · ${extra} metas</span><span>${extraPct}%</span></div>
              <div class="evo-hbar-track"><div class="evo-hbar-fill grey" style="width:${extraPct}%"></div></div>
            </div>` : ''}
          </div>`}
        </div>
      </div>`;

    document.getElementById('tab-evo').innerHTML = statCards + chartMetas + chartPts + chartDiff;
  }

  // ── Edit Profile Canvas ───────────────────────────────────────────────────────
  const EDIT_GRID = 100, EDIT_CELL = 5, EDIT_PX = 500;
  let EDIT_BRUSH = 2;
  let editCanvas = null, editCtx = null;
  let editPixels = new Array(EDIT_GRID * EDIT_GRID).fill(false);
  let editPainting = false, editPaintVal = true;

  function initEditCanvas() {
    editCanvas = document.getElementById('edit-pixel-canvas');
    editCtx    = editCanvas.getContext('2d');
    editCanvas.width  = EDIT_PX;
    editCanvas.height = EDIT_PX;

    editCanvas.addEventListener('mousedown', e => { editPainting = true; editPaintAt(e.clientX, e.clientY); });
    editCanvas.addEventListener('mousemove', e => { if (editPainting) editPaintAt(e.clientX, e.clientY); });
    editCanvas.addEventListener('mouseup',    () => { editPainting = false; });
    editCanvas.addEventListener('mouseleave', () => { editPainting = false; });
    editCanvas.addEventListener('touchstart', e => { e.preventDefault(); editPainting = true; editPaintAt(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
    editCanvas.addEventListener('touchmove',  e => { e.preventDefault(); if (editPainting) editPaintAt(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
    editCanvas.addEventListener('touchend',   e => { e.preventDefault(); editPainting = false; }, { passive: false });

    const sl = document.getElementById('edit-brush-slider');
    sl.addEventListener('input', () => {
      EDIT_BRUSH = parseInt(sl.value);
      document.getElementById('edit-brush-label').textContent = EDIT_BRUSH + 'px';
    });
  }

  function editSelectColor(black) {
    editPaintVal = black;
    const bk = document.getElementById('edit-btn-black');
    const wh = document.getElementById('edit-btn-white');
    const base = "padding:6px 14px;border:2px solid;cursor:pointer;font-family:'Micro 5',monospace;font-size:24px;font-weight:bold;text-transform:uppercase;";
    if (black) {
      bk.style.cssText = base + 'border-color:#000;background:#000;color:#fff;box-shadow:2px 2px 0 #555;';
      wh.style.cssText = base + 'border-color:#A0A0A0;background:#fff;color:#888;box-shadow:2px 2px 0 #A0A0A0;';
    } else {
      wh.style.cssText = base + 'border-color:#000;background:#fff;color:#000;box-shadow:2px 2px 0 #555;';
      bk.style.cssText = base + 'border-color:#A0A0A0;background:#eee;color:#888;box-shadow:2px 2px 0 #A0A0A0;';
    }
  }

  function editRenderCanvas() {
    editCtx.fillStyle = '#fff';
    editCtx.fillRect(0, 0, EDIT_PX, EDIT_PX);
    for (let y = 0; y < EDIT_GRID; y++) {
      for (let x = 0; x < EDIT_GRID; x++) {
        if (editPixels[y * EDIT_GRID + x]) {
          editCtx.fillStyle = '#000';
          editCtx.fillRect(x * EDIT_CELL, y * EDIT_CELL, EDIT_CELL, EDIT_CELL);
        }
      }
    }
    editCtx.strokeStyle = 'rgba(180,180,180,0.35)';
    editCtx.lineWidth = 0.5;
    for (let x = 0; x <= EDIT_GRID; x++) {
      editCtx.beginPath(); editCtx.moveTo(x * EDIT_CELL, 0); editCtx.lineTo(x * EDIT_CELL, EDIT_PX); editCtx.stroke();
    }
    for (let y = 0; y <= EDIT_GRID; y++) {
      editCtx.beginPath(); editCtx.moveTo(0, y * EDIT_CELL); editCtx.lineTo(EDIT_PX, y * EDIT_CELL); editCtx.stroke();
    }
  }

  function editPaintAt(clientX, clientY) {
    const rect = editCanvas.getBoundingClientRect();
    const sx = EDIT_PX / rect.width, sy = EDIT_PX / rect.height;
    const cx = Math.floor((clientX - rect.left) * sx / EDIT_CELL);
    const cy = Math.floor((clientY - rect.top)  * sy / EDIT_CELL);
    const half = Math.floor(EDIT_BRUSH / 2);
    for (let dy = -half; dy < EDIT_BRUSH - half; dy++) {
      for (let dx = -half; dx < EDIT_BRUSH - half; dx++) {
        const px = cx + dx, py = cy + dy;
        if (px < 0 || px >= EDIT_GRID || py < 0 || py >= EDIT_GRID) continue;
        editPixels[py * EDIT_GRID + px] = editPaintVal;
        editCtx.fillStyle = editPaintVal ? '#000' : '#fff';
        editCtx.fillRect(px * EDIT_CELL, py * EDIT_CELL, EDIT_CELL, EDIT_CELL);
      }
    }
  }

  function editClearCanvas() {
    editPixels.fill(false);
    editRenderCanvas();
  }

  function editGetAvatarDataURL() {
    const off  = document.createElement('canvas');
    off.width  = EDIT_GRID;
    off.height = EDIT_GRID;
    const octx = off.getContext('2d');
    octx.fillStyle = '#fff';
    octx.fillRect(0, 0, EDIT_GRID, EDIT_GRID);
    for (let y = 0; y < EDIT_GRID; y++) {
      for (let x = 0; x < EDIT_GRID; x++) {
        if (editPixels[y * EDIT_GRID + x]) {
          octx.fillStyle = '#000';
          octx.fillRect(x, y, 1, 1);
        }
      }
    }
    return off.toDataURL('image/png');
  }

  function loadAvatarToCanvas(dataURL) {
    if (!dataURL) { editRenderCanvas(); return; }
    const img  = new Image();
    img.onload = () => {
      const tmp  = document.createElement('canvas');
      tmp.width  = EDIT_GRID;
      tmp.height = EDIT_GRID;
      const tctx = tmp.getContext('2d');
      tctx.drawImage(img, 0, 0, EDIT_GRID, EDIT_GRID);
      const data = tctx.getImageData(0, 0, EDIT_GRID, EDIT_GRID).data;
      for (let i = 0; i < EDIT_GRID * EDIT_GRID; i++) {
        editPixels[i] = (data[i * 4] + data[i * 4 + 1] + data[i * 4 + 2]) / 3 < 128;
      }
      editRenderCanvas();
    };
    img.src = dataURL;
  }

  function openEditModal() {
    if (!viewedProfile) return;
    document.getElementById('edit-name').value = viewedProfile.name;
    document.getElementById('edit-error').classList.add('hidden');
    document.getElementById('edit-save-btn').disabled = false;
    document.getElementById('edit-save-btn').textContent = 'Salvar';
    document.getElementById('edit-modal').classList.remove('hidden');
    if (!editCanvas) initEditCanvas();
    editPixels = new Array(EDIT_GRID * EDIT_GRID).fill(false);
    EDIT_BRUSH = 2;
    document.getElementById('edit-brush-slider').value = 2;
    document.getElementById('edit-brush-label').textContent = '2px';
    editSelectColor(true);
    loadAvatarToCanvas(viewedProfile.avatar_data);
    setTimeout(() => document.getElementById('edit-name').focus(), 50);
  }

  function closeEditModal() {
    document.getElementById('edit-modal').classList.add('hidden');
  }

  async function saveProfile() {
    const name = document.getElementById('edit-name').value.trim();
    const btn  = document.getElementById('edit-save-btn');
    const err  = document.getElementById('edit-error');
    err.classList.add('hidden');
    if (!name) {
      err.textContent = 'Nome não pode estar vazio.';
      err.classList.remove('hidden');
      return;
    }
    btn.disabled = true;
    btn.textContent = '...';
    const avatar = editGetAvatarDataURL();
    const { data, error } = await sb
      .from('profiles')
      .update({ name, avatar_data: avatar })
      .eq('id', viewedProfile.id)
      .select('*')
      .single();
    if (error) {
      err.textContent = error.message;
      err.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = 'Salvar';
      return;
    }
    setStoredProfile(data);
    closeEditModal();
    window.location.reload();
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeEditModal(); });

  init();
  initSkrillWalker();
  </script>
</body>
</html>

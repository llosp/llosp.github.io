<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SKRILL — Leaderboard</title>
  <link rel="icon" type="image/x-icon" href="/skrill/favicon.ico"/>
  <link rel="stylesheet" href="/skrill/css/style.css"/>
</head>
<body>
  <div class="orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
  <div class="app-layout">
    <div id="sidebar-root"></div>
    <main class="main-content">
      <div class="page-inner">
        <div id="app" class="center-screen"><div class="spinner"></div></div>
      </div>
    </main>
    <div id="mobile-nav-root"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/skrill/js/client.js"></script>
  <script>
  if (!isAppUnlocked()) { window.location.href = '/skrill/login/'; }
  else if (!getStoredProfile()) { window.location.href = '/skrill/select-profile/'; }

  async function init() {
    const stored = requireAuth();
    if (!stored) return;

    const [{ data: profile }, { data: profiles }] = await Promise.all([
      sb.from('profiles').select('*').eq('id', stored.id).single(),
      sb.from('profiles').select('*'),
    ]);

    if (profile) setStoredProfile(profile);

    document.getElementById('sidebar-root').innerHTML = renderSidebar(profile, 'leaderboard');
    document.getElementById('mobile-nav-root').innerHTML = renderMobileNav('leaderboard');

    const byWeekly  = [...(profiles ?? [])].sort((a, b) => (b.weekly_points ?? 0) - (a.weekly_points ?? 0));
    const byAllTime = [...(profiles ?? [])].sort((a, b) => (b.total_points  ?? 0) - (a.total_points  ?? 0));
    const myWeekRank = byWeekly.findIndex(p => p.id === stored.id) + 1;

    document.getElementById('app').innerHTML = `
      <div style="width:100%">
        <div class="page-header">
          <div>
            <div class="page-header-label">[T] Rankings</div>
            <h1 class="page-header-title">Leaderboard</h1>
          </div>
          <div style="text-align:right">
            <div class="text-muted text-sm">${profiles?.length ?? 0} membros</div>
            ${myWeekRank ? `<div style="font-size:12px;font-weight:700;color:var(--purple-400);margin-top:2px">★ Seu rank: #${myWeekRank}</div>` : ''}
          </div>
        </div>

        <div class="tab-list">
          <button class="tab-btn active" data-tab="tab-weekly"  onclick="switchTab('tab-weekly')">Semanal</button>
          <button class="tab-btn"        data-tab="tab-alltime" onclick="switchTab('tab-alltime')">[T] Total</button>
        </div>

        <div id="tab-weekly" class="tab-panel active">
          ${renderPodium(byWeekly, stored.id, 'weekly_points')}
          ${byWeekly.length > 3 ? renderList(byWeekly.slice(3), stored.id, 'weekly_points', 4) : ''}
          ${byWeekly.length === 0 ? emptyState('[T]', 'Nenhum membro ainda', 'Complete uma meta para aparecer aqui!') : ''}
        </div>
        <div id="tab-alltime" class="tab-panel">
          ${renderList(byAllTime, stored.id, 'total_points', 1)}
        </div>
      </div>`;
  }

  function renderPodium(entries, currentId, field) {
    if (entries.length < 3) return '';
    const [first, second, third] = entries;
    function col(p, cls, medal) {
      return `<div class="podium-col ${cls}">
        <div class="podium-medal">${medal}</div>
        ${avatarHTML(p, cls === 'p1' ? 'avatar-lg' : 'avatar-md')}
        <div class="podium-name">${p.name}</div>
        <div class="podium-xp">${(p[field] ?? 0).toLocaleString()}pts</div>
        <div class="podium-block"></div>
      </div>`;
    }
    return `
      <div class="glass" style="margin-bottom:20px">
        <p style="text-align:center;font-size:11px;font-weight:700;color:rgba(251,191,36,0.7);text-transform:uppercase;letter-spacing:.06em;padding-top:16px">
          Top da Guild Esta Semana
        </p>
        <div class="podium">
          ${col(second, 'p2', '#2')}
          ${col(first,  'p1', '#1')}
          ${col(third,  'p3', '#3')}
        </div>
      </div>`;
  }

  function renderList(entries, currentId, field, startRank) {
    if (!entries.length) return '';
    return `
      <p style="font-size:11px;color:rgba(0,0,0,0.3);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:8px">
        Classificação Completa
      </p>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${entries.map((p, i) => `
          <a href="/skrill/profile/?id=${p.id}" class="lb-entry ${i+startRank===1?'r1':i+startRank===2?'r2':i+startRank===3?'r3':''} ${p.id===currentId?'me':''}">
            <div class="rank-num">#${i + startRank}</div>
            ${avatarHTML(p)}
            <div class="entry-info">
              <div class="entry-name-main">${p.name}</div>
              <div class="entry-name-sub">${p.streak_current ?? 0}w streak</div>
            </div>
            <div class="entry-xp">${(p[field] ?? 0).toLocaleString()}pts</div>
          </a>`).join('')}
      </div>`;
  }

  function emptyState(icon, title, sub) {
    return `<div class="empty-state"><div class="empty-icon">${icon}</div><h3>${title}</h3><p>${sub}</p></div>`;
  }

  init();
  </script>
</body>
</html>

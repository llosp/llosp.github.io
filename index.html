<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clicachorro</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fuzzy+Bubbles:wght@400;700&display=swap" rel="stylesheet">
  <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
</head>

<body>

  <div class="estrelas"></div>

  <!-- HUD -->
  <div class="hud">
    <div class="contador" id="contador">🐾 0</div>
    <div class="cps-display" id="cps-display"></div>
    <div class="combo-display" id="combo-display"></div>
  </div>

  <!-- Loja button -->
  <button class="btn-loja" id="btnLoja" title="Loja">
    <img src="img/loja-icon.webp" alt="Loja" draggable="false">
  </button>

  <!-- Loja menu -->
  <div class="loja-menu" id="lojaMenu">
    <div class="loja-header">
      <div class="loja-titulo">Loja</div>
      <div class="loja-saldo" id="lojaSaldo">0 moedas</div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn ativo" data-tab="itens">Itens</button>
      <button class="tab-btn"       data-tab="melhorias">Melhorias</button>
    </div>

    <!-- Itens tab -->
    <div class="tab-panel ativo" id="tab-itens">
      <div class="loja-itens" id="shop-itens"></div>
    </div>

    <!-- Melhorias tab -->
    <div class="tab-panel" id="tab-melhorias">
      <div class="loja-itens" id="shop-multi"></div>
    </div>

    <div class="loja-footer">
      <button id="btn-reset" class="btn-reset">⚠ Resetar Save</button>
    </div>

    <!-- Conquistas section -->
    <div class="conquistas-section">
      <div class="conquistas-section-header" id="conquistas-toggle">
        Conquistas <span class="conquistas-chevron">▲</span>
      </div>
      <div class="conquistas-lista" id="shop-conquistas"></div>
    </div>
  </div>

  <!-- Notification toast -->
  <div class="notificacao" id="notificacao"></div>

  <!-- Offline progress modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal-box" id="modal-body"></div>
  </div>

  <!-- Item chain visuals (visibility + src managed by items.js) -->
  <img class="bambu"   id="bambu"   src="img/bamboo_0.webp" draggable="false">
  <img class="cama"    id="cama"    src="img/cama_2.webp"     draggable="false">
  <img class="poster"  id="poster"  src="img/poster_0.webp" draggable="false">
  <img class="armario" id="armario" src="img/armario.webp"  draggable="false">
  <img class="boombox" id="boombox" src="img/boombox.webp"  draggable="false">
  <img class="plushie" id="plushie" src="img/plushie.webp"  draggable="false">

  <!-- Background hue slider (unlockable via corFundo item) -->
  <div class="slider-fundo" id="sliderFundo">
    <input type="range" min="0" max="360" value="346" id="sliderMatiz">
  </div>

  <!-- Main dog scene -->
  <div class="caixa">
    <div class="cachorro-container">
      <img class="cachorro" src="img/cachorro.webp" draggable="false">
      <div class="hitbox olho-hitbox"></div>
      <div class="hitbox honk-hitbox"></div>
      <div class="olho">
        <div class="palpebra cima"></div>
        <div class="palpebra baixo"></div>
        <div class="bola"></div>
      </div>
    </div>
  </div>

  <script type="module" src="js/game.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SKRILL — Dashboard</title>
  <link rel="icon" type="image/x-icon" href="/skrill/favicon.ico"/>
  <link rel="stylesheet" href="/skrill/css/style.css"/>
</head>
<body>
  <div class="orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
  <div class="app-layout">
    <div id="sidebar-root"></div>
    <main class="main-content">
      <div class="page-inner">
        <div id="app" class="center-screen"><div class="spinner"></div></div>
      </div>
    </main>
    <div id="mobile-nav-root"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/skrill/js/client.js"></script>
  <script>
  if (!isAppUnlocked()) { window.location.href = '/skrill/login/'; }
  else if (!getStoredProfile()) { window.location.href = '/skrill/select-profile/'; }

  async function init() {
    const stored = requireAuth();
    if (!stored) return;

    const [
      { data: profile },
      { data: week },
      { data: goals },
      { data: history },
      { data: allProfiles },
      { data: meeting },
    ] = await Promise.all([
      sb.from('profiles').select('*').eq('id', stored.id).single(),
      sb.from('weeks').select('*').eq('is_current', true).single(),
      sb.from('goals').select('*, profile:profiles(*)').order('created_at', { ascending: false }).limit(50),
      sb.from('point_history').select('*').eq('profile_id', stored.id).order('created_at', { ascending: false }).limit(20),
      sb.from('profiles').select('*').order('weekly_points', { ascending: false }).limit(6),
      sb.from('meetings').select('*').order('scheduled_at', { ascending: false }).limit(1).single(),
    ]);

    if (profile) setStoredProfile(profile);

    document.getElementById('sidebar-root').innerHTML = renderSidebar(profile, 'dashboard');
    document.getElementById('mobile-nav-root').innerHTML = renderMobileNav('dashboard');

    const myGoals = (goals ?? []).filter(g => g.profile_id === stored.id);
    const done    = myGoals.filter(g => g.status === 'completed' || g.status === 'beyond');

    document.getElementById('app').innerHTML = `
      <div style="width:100%">
        <div class="page-header">
          <div>
            <div class="page-header-label">Bem-vindo de volta,</div>
            <h1 class="page-header-title">${profile?.name ?? 'Guild Member'}</h1>
          </div>
          ${week ? `<span class="text-muted text-sm">Semana ${week.week_number} · ${week.year}</span>` : ''}
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon amber">PTS</div>
            <div class="stat-value">${(profile?.total_points ?? 0).toLocaleString()}</div>
            <div class="stat-label">Total Pts</div>
            <div class="stat-sub">acumulado</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon purple">WK</div>
            <div class="stat-value">${profile?.weekly_points ?? 0}</div>
            <div class="stat-label">Pts Semana</div>
            <div class="stat-sub">esta semana</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon green">[G]</div>
            <div class="stat-value">${done.length}/${myGoals.length}</div>
            <div class="stat-label">Metas Feitas</div>
            <div class="stat-sub">esta semana</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon cyan">STK</div>
            <div class="stat-value">${profile?.streak_current ?? 0}w</div>
            <div class="stat-label">Streak</div>
            <div class="stat-sub">melhor: ${profile?.streak_longest ?? 0}w</div>
          </div>
        </div>

        <div class="main-grid">
          <div class="col-left">
            ${renderWeeklyProgress(myGoals)}
            ${renderActivityFeed(history ?? [])}
          </div>
          <div class="col-right">
            ${renderMiniLeaderboard(allProfiles ?? [], stored.id)}
            ${renderNextMeeting(meeting)}
          </div>
        </div>
      </div>`;
  }

  function renderWeeklyProgress(goals) {
    if (!goals.length) return `
      <div class="card">
        <div class="card-header"><div class="card-title">>> Progresso Semanal</div></div>
        <div class="card-body">
          <div class="empty-state"><div class="empty-icon">[G]</div><p>Nenhuma meta ainda esta semana</p></div>
        </div>
      </div>`;
    const rows = goals.slice(0, 8).map(g => `
      <div class="goal-row">
        <span style="font-size:13px">${g.status === 'completed' || g.status === 'beyond' ? '[v]' : '[ ]'}</span>
        <div class="goal-row-title">${g.title}</div>
        ${statusBadge(g.status, g.points_earned)}
      </div>`).join('');
    return `
      <div class="card">
        <div class="card-header">
          <div class="card-title">>> Progresso Semanal</div>
          <a href="/skrill/weekly/" class="card-link">Ver tudo →</a>
        </div>
        <div class="card-body"><div class="goal-rows">${rows}</div></div>
      </div>`;
  }

  function renderActivityFeed(history) {
    if (!history.length) return `
      <div class="card">
        <div class="card-header"><div class="card-title">Atividade</div></div>
        <div class="card-body"><div class="empty-state"><p>Nenhuma atividade ainda</p></div></div>
      </div>`;
    const items = history.map(h => `
      <div class="activity-item">
        <div class="activity-dot">&gt;</div>
        <div>
          <div class="activity-text">Ganhou <strong>+${h.amount}pts</strong> — ${h.reason.replace(/_/g, ' ')}</div>
          <div class="activity-time">${timeAgo(h.created_at)}</div>
        </div>
      </div>`).join('');
    return `
      <div class="card">
        <div class="card-header"><div class="card-title">Atividade</div></div>
        <div class="card-body">${items}</div>
      </div>`;
  }

  function renderMiniLeaderboard(profiles, currentId) {
    if (!profiles.length) return `
      <div class="card">
        <div class="card-header"><div class="card-title">[T] Top Guild</div></div>
        <div class="card-body"><div class="empty-state"><p>Nenhum membro ainda</p></div></div>
      </div>`;
    const items = profiles.slice(0, 5).map((p, i) => `
      <a href="/skrill/profile/?id=${p.id}" class="lb-entry ${i===0?'r1':i===1?'r2':i===2?'r3':''} ${p.id===currentId?'me':''}">
        <div class="rank-num">${i===0?'#1':i===1?'#2':i===2?'#3':'#'+(i+1)}</div>
        ${avatarHTML(p)}
        <div class="entry-info"><div class="entry-name-main">${p.name}</div></div>
        <div class="entry-xp">${p.weekly_points ?? 0}pts</div>
      </a>`).join('');
    return `
      <div class="card">
        <div class="card-header">
          <div class="card-title">[T] Top Guild</div>
          <a href="/skrill/leaderboard/" class="card-link">Ver tudo →</a>
        </div>
        <div class="card-body" style="padding:8px 12px">${items}</div>
      </div>`;
  }

  function renderNextMeeting(meeting) {
    if (!meeting) return '';
    const d = new Date(meeting.scheduled_at);
    return `
      <div class="meeting-card">
        <div class="meeting-lbl">Próxima Reunião</div>
        <div class="meeting-date">${d.toLocaleDateString('pt-BR', { weekday: 'short', month: 'short', day: 'numeric' })}</div>
        <div class="meeting-time">${d.toLocaleTimeString('pt-BR', { hour: 'numeric', minute: '2-digit' })}</div>
        ${meeting.discord_link ? `<a href="${meeting.discord_link}" target="_blank" class="btn btn-sm btn-purple-soft" style="margin-top:10px">Entrar Discord →</a>` : ''}
      </div>`;
  }

  init();
  </script>
</body>
</html>

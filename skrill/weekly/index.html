<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SKRILL — Weekly Goals</title>
  <link rel="icon" type="image/x-icon" href="/skrill/favicon.ico"/>
  <link rel="stylesheet" href="/skrill/css/style.css"/>
</head>
<body>
  <div class="orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
  <div class="app-layout">
    <div id="sidebar-root"></div>
    <main class="main-content">
      <div class="page-inner">
        <div id="app" class="center-screen"><div class="spinner"></div></div>
      </div>
    </main>
    <div id="mobile-nav-root"></div>
  </div>

  <!-- Add Goal Modal -->
  <div id="modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-title">🎯 New Goal</div>
      <form id="goal-form" onsubmit="handleAddGoal(event)">
        <div class="form-group">
          <label class="form-label">Title</label>
          <input id="goal-title" class="form-input" type="text" placeholder="What will you accomplish?" required maxlength="120"/>
        </div>
        <div class="form-group">
          <label class="form-label">Description <span class="text-muted">(optional)</span></label>
          <textarea id="goal-desc" class="form-input" placeholder="Add more context..."></textarea>
        </div>
        <div id="goal-error" class="form-error hidden"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button type="submit" id="goal-submit" class="btn btn-primary">Declare Goal</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/skrill/js/client.js"></script>
  <script>
  let currentUser = null;
  let currentWeek = null;
  let allGoals    = [];

  async function init() {
    const user = await requireAuth();
    if (!user) return;

    const [{ data: profile }, { data: week }] = await Promise.all([
      sb.from('profiles').select('*').eq('id', user.id).single(),
      sb.from('weeks').select('*').eq('is_current', true).single(),
    ]);

    currentUser = profile;
    currentWeek = week;

    document.getElementById('sidebar-root').innerHTML = renderSidebar(profile, 'weekly');
    document.getElementById('mobile-nav-root').innerHTML = renderMobileNav('weekly');
    initParticles();

    if (week) {
      const { data: goals } = await sb
        .from('goals')
        .select('*, profile:profiles(*)')
        .eq('week_id', week.id)
        .order('created_at', { ascending: false });
      allGoals = goals ?? [];
    }

    renderPage();
  }

  function renderPage() {
    const week = currentWeek;
    const myGoals    = allGoals.filter(g => g.user_id === currentUser?.id);
    const otherGoals = allGoals.filter(g => g.user_id !== currentUser?.id);

    let weekLabel = 'This Week';
    let weekSub   = '';
    if (week) {
      weekLabel = `Week ${week.week_number}`;
      const s = new Date(week.start_date);
      const e = new Date(week.end_date);
      weekSub = ` · ${s.toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${e.toLocaleDateString('en-US',{month:'short',day:'numeric'})}`;
    }

    document.getElementById('app').innerHTML = `
      <div style="width:100%">
        <div class="page-header">
          <div>
            <div class="page-header-label">🎯 Weekly Goals</div>
            <h1 class="page-header-title">${weekLabel}<span class="page-header-sub">${weekSub}</span></h1>
          </div>
          <button class="btn btn-primary" onclick="openModal()">+ Declare Goal</button>
        </div>

        <div class="tab-list">
          <button class="tab-btn active" data-tab="tab-all"    onclick="switchTab('tab-all')">
            All <span class="tab-count">${allGoals.length}</span>
          </button>
          <button class="tab-btn" data-tab="tab-mine"   onclick="switchTab('tab-mine')">
            Mine <span class="tab-count">${myGoals.length}</span>
          </button>
          <button class="tab-btn" data-tab="tab-others" onclick="switchTab('tab-others')">
            Others <span class="tab-count">${otherGoals.length}</span>
          </button>
        </div>

        <div id="tab-all" class="tab-panel active">
          ${renderGoals(allGoals)}
        </div>
        <div id="tab-mine" class="tab-panel">
          ${renderGoals(myGoals, true)}
        </div>
        <div id="tab-others" class="tab-panel">
          ${renderGoals(otherGoals, false)}
        </div>
      </div>`;
  }

  function renderGoals(goals, isOwnerAll) {
    if (!goals.length) return `<div class="empty-state"><div class="empty-icon">🎯</div><h3>No goals yet</h3><p>Be the first to declare one!</p></div>`;
    return goals.map((g, i) => renderGoalCard(g, isOwnerAll ?? (g.user_id === currentUser?.id))).join('');
  }

  function renderGoalCard(g, isOwner) {
    const profile = g.profile;
    const isDone  = g.status === 'completed' || g.status === 'beyond';
    const actions = isOwner && g.status === 'active'
      ? `<div class="goal-actions">
          <button class="btn btn-sm btn-success" onclick="completeGoal('${g.id}', false)">✓ Done</button>
          <button class="btn btn-sm btn-purple-soft" onclick="completeGoal('${g.id}', true)">⚡ Beyond</button>
        </div>`
      : '';
    return `
      <div class="goal-card ${g.status === 'beyond' ? 'beyond' : g.status === 'completed' ? 'completed' : ''}" id="goal-${g.id}">
        <div class="goal-card-top">
          ${profile ? avatarHTML(profile) : ''}
          <div class="goal-card-meta">
            <div class="goal-user-row">
              ${profile ? `<span class="goal-username">${profile.display_name ?? profile.username}</span>` : ''}
              <span class="goal-time">${timeAgo(g.created_at)}</span>
            </div>
            <div class="goal-title ${isDone ? 'done' : g.status === 'failed' ? 'failed' : ''}">${g.title}</div>
            ${g.description ? `<div class="goal-desc">${g.description}</div>` : ''}
          </div>
        </div>
        <div class="goal-footer">
          ${statusBadge(g.status, g.points_earned)}
          ${actions}
        </div>
      </div>`;
  }

  async function handleAddGoal(e) {
    e.preventDefault();
    const title = document.getElementById('goal-title').value.trim();
    const desc  = document.getElementById('goal-desc').value.trim();
    const btn   = document.getElementById('goal-submit');
    const errEl = document.getElementById('goal-error');
    errEl.classList.add('hidden');
    btn.disabled = true; btn.textContent = '...';

    try {
      const { data: { user } } = await sb.auth.getUser();
      const { data: newGoal, error } = await sb
        .from('goals')
        .insert({
          user_id: user.id,
          week_id: currentWeek?.id,
          title,
          description: desc || null,
          status: 'active',
          points_earned: 0,
        })
        .select('*, profile:profiles(*)')
        .single();

      if (error) { errEl.textContent = error.message; errEl.classList.remove('hidden'); return; }

      // Award 1xp for declaring
      await sb.from('point_history').insert({ user_id: user.id, amount: 1, reason: 'declare_goal', goal_id: newGoal.id, week_id: currentWeek?.id });
      await sb.from('profiles').update({ xp: (currentUser?.xp ?? 0) + 1, total_xp: (currentUser?.total_xp ?? 0) + 1 }).eq('id', user.id);

      allGoals.unshift(newGoal);
      closeModal();
      renderPage();
    } finally {
      btn.disabled = false; btn.textContent = 'Declare Goal';
    }
  }

  async function completeGoal(goalId, beyond) {
    const pts = beyond ? 8 : 5;
    await sb.from('goals').update({
      status: beyond ? 'beyond' : 'completed',
      points_earned: pts,
      is_beyond_scope: beyond,
      completed_at: new Date().toISOString(),
    }).eq('id', goalId);

    await sb.from('point_history').insert([
      { user_id: currentUser.id, amount: 5, reason: 'complete_goal', goal_id: goalId, week_id: currentWeek?.id },
      ...(beyond ? [{ user_id: currentUser.id, amount: 3, reason: 'beyond_scope', goal_id: goalId, week_id: currentWeek?.id }] : []),
    ]);

    await sb.from('profiles').update({
      xp: (currentUser?.xp ?? 0) + pts,
      total_xp: (currentUser?.total_xp ?? 0) + pts,
    }).eq('id', currentUser.id);

    allGoals = allGoals.map(g => g.id === goalId ? { ...g, status: beyond ? 'beyond' : 'completed', points_earned: pts } : g);
    renderPage();
  }

  function openModal() {
    document.getElementById('goal-title').value = '';
    document.getElementById('goal-desc').value  = '';
    document.getElementById('goal-error').classList.add('hidden');
    document.getElementById('modal').classList.remove('hidden');
  }
  function closeModal() { document.getElementById('modal').classList.add('hidden'); }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  init();
  </script>
</body>
</html>

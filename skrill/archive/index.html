<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SKRILL — Acervo</title>
  <link rel="icon" type="image/x-icon" href="/skrill/favicon.ico"/>
  <link rel="stylesheet" href="/skrill/css/style.css"/>
</head>
<body>
  <div class="orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
  <div class="app-layout">
    <div id="sidebar-root"></div>
    <main class="main-content">
      <div class="page-inner">
        <div id="app" class="center-screen"><div class="spinner"></div></div>
      </div>
    </main>
    <div id="mobile-nav-root"></div>
  </div>

  <!-- Modal de resumo da temporada -->
  <div id="season-modal" class="modal-overlay hidden" onclick="if(event.target===this)closeSeasonDetail()">
    <div class="modal modal-wide">
      <div class="modal-title" style="gap:8px">
        <img src="/skrill/img/archive.svg" alt="acervo" style="width:24px;height:24px">
        <span id="season-modal-title" style="flex:1"></span>
        <button class="win-btn" onclick="closeSeasonDetail()" style="font-family:'Micro 5',monospace">X</button>
      </div>
      <div class="modal-body modal-scroll" id="season-modal-body"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/skrill/js/client.js"></script>
  <script>
  if (!isAppUnlocked()) { window.location.href = '/skrill/login/'; }
  else if (!getStoredProfile()) { window.location.href = '/skrill/select-profile/'; }

  const MONTHS = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const GRID12 = `<div class="arch-grid">${'<span></span>'.repeat(12)}</div>`;

  let weeks = [];
  const goalsByWeek  = {};
  const pointsByWeek = {};

  function fmtDate(s) {
    const [y, m, d] = s.split('-');
    return `${d}/${m}/${y}`;
  }
  function dayOfYear(s) {
    const [y, m, d] = s.split('-').map(Number);
    const date  = new Date(y, m - 1, d);
    const start = new Date(y, 0, 1);
    return Math.floor((date - start) / 86400000);
  }

  async function init() {
    const stored = requireAuth();
    if (!stored) return;

    try {
      const [{ data: profile }, { data: wks }, { data: goals }, { data: history }] = await Promise.all([
        sb.from('profiles').select('*').eq('id', stored.id).single(),
        sb.from('weeks').select('*'),
        sb.from('goals').select('*, profile:profiles(*)').not('week_id', 'is', null),
        sb.from('point_history').select('week_id,amount'),
      ]);

      if (profile) setStoredProfile(profile);
      document.getElementById('sidebar-root').innerHTML    = renderSidebar(profile, 'archive');
      document.getElementById('mobile-nav-root').innerHTML = renderMobileNav('archive');

      weeks = (wks ?? []).filter(w => w.start_date && w.end_date);
      (goals ?? []).forEach(g => { (goalsByWeek[g.week_id] ??= []).push(g); });
      (history ?? []).forEach(h => { pointsByWeek[h.week_id] = (pointsByWeek[h.week_id] ?? 0) + (h.amount ?? 0); });

      renderPage();
    } catch (e) {
      const app = document.getElementById('app');
      app.classList.remove('center-screen');
      app.innerHTML = `<div class="card" style="text-align:center;padding:40px;color:var(--red)">Erro ao carregar o acervo.<br>${e.message ?? e}</div>`;
    }
  }

  function renderPage() {
    const app = document.getElementById('app');
    app.classList.remove('center-screen');

    const header = `
      <div class="page-header">
        <div>
          <div class="page-header-label" style="display:flex;align-items:center;gap:8px"><img src="/skrill/img/archive.svg" alt="acervo" style="width:24px;height:24px"> Linha do tempo</div>
          <h1 class="page-header-title">Acervo</h1>
        </div>
      </div>`;

    if (!weeks.length) {
      app.innerHTML = `<div style="width:100%">${header}
        <div class="card" style="text-align:center;padding:48px 20px">
          <div style="font-size:30px;font-weight:700;margin-bottom:8px">Nenhuma temporada arquivada</div>
          <div style="font-size:24px;color:var(--text-muted)">Assim que a primeira temporada terminar, ela aparece aqui.</div>
        </div></div>`;
      return;
    }

    // Agrupa por ano, anos mais recentes primeiro; dentro do ano, ordem cronológica
    const byYear = {};
    weeks.forEach(w => { (byYear[w.year] ??= []).push(w); });
    const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

    const yearsHTML = years.map(year => {
      const seasons = byYear[year].sort((a, b) => a.start_date.localeCompare(b.start_date));
      const rows = seasons.map(w => {
        const pts   = pointsByWeek[w.id] ?? 0;
        const startD = dayOfYear(w.start_date);
        const sameYearEnd = w.end_date.startsWith(String(year));
        const endD  = sameYearEnd ? dayOfYear(w.end_date) : 364;
        const left  = Math.max(0, Math.min(100, (startD / 365) * 100));
        const width = Math.max(2, Math.min(100 - left, ((endD - startD + 1) / 365) * 100));
        const range = `${fmtDate(w.start_date)} – ${fmtDate(w.end_date)}`;
        return `
          <div class="arch-row" onclick="openSeasonDetail('${w.id}')">
            <div>
              <div class="arch-row-name">Temporada ${w.week_number}${w.is_current ? ' ·' : ''}</div>
              <div class="arch-row-pts">${pts} pts${w.is_current ? ' · ATUAL' : ''}</div>
            </div>
            <div class="arch-track">
              ${GRID12}
              <div class="arch-bar ${w.is_current ? 'current' : ''}" style="left:${left}%;width:${width}%" title="${range}">
                <span class="arch-bar-txt">${range}</span>
              </div>
            </div>
          </div>`;
      }).join('');

      return `
        <div class="arch-year">
          <div class="arch-year-head">${year}</div>
          <div class="arch-months">
            <span></span>
            <div class="arch-months-track">${MONTHS.map(m => `<span>${m}</span>`).join('')}</div>
          </div>
          ${rows}
        </div>`;
    }).join('');

    app.innerHTML = `<div style="width:100%">${header}${yearsHTML}</div>`;
  }

  function openSeasonDetail(id) {
    const w = weeks.find(x => x.id === id);
    if (!w) return;
    const g        = goalsByWeek[id] ?? [];
    const done     = g.filter(x => x.status === 'completed');
    const pts      = pointsByWeek[id] ?? 0;
    const revealed = w.skrill_time_revealed;
    const participants = new Set(g.map(x => x.profile_id)).size;
    const imgCount = done.reduce((s, x) => s + ((x.image_urls ?? []).length), 0);

    const withImgs = done.filter(x => (x.image_urls ?? []).length);
    const feed = withImgs.length
      ? withImgs.map(x => `
          <div class="arch-delivery">
            <div class="arch-delivery-head">
              ${avatarHTML(x.profile)}
              <div style="flex:1;min-width:0">
                <div class="arch-delivery-name">${x.profile?.name ?? '?'}</div>
                <div class="arch-delivery-title">${x.title}</div>
              </div>
              ${statusBadge(x.status, x.points_earned ?? 0)}
            </div>
            <div class="delivery-images">
              ${x.image_urls.map(u => `<img class="delivery-img${revealed ? '' : ' blurred'}" src="${u}" alt="entrega">`).join('')}
            </div>
          </div>`).join('')
      : `<div style="font-size:22px;color:var(--text-muted);text-align:center;padding:20px">Nenhuma imagem foi enviada nesta temporada.</div>`;

    document.getElementById('season-modal-title').textContent = `Temporada ${w.week_number} · ${w.year}`;
    document.getElementById('season-modal-body').innerHTML = `
      <div style="font-size:22px;color:var(--text-muted);text-transform:uppercase;margin-bottom:14px">${fmtDate(w.start_date)} – ${fmtDate(w.end_date)}</div>
      <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:18px">
        <div class="stat-card"><div class="stat-value">${pts}</div><div class="stat-label">Total Pts</div></div>
        <div class="stat-card"><div class="stat-value">${done.length}</div><div class="stat-label">Metas Feitas</div></div>
        <div class="stat-card"><div class="stat-value">${participants}</div><div class="stat-label">Participantes</div></div>
      </div>
      ${!revealed ? `<div style="font-size:20px;color:var(--text-muted);margin-bottom:10px">Imagens borradas — temporada ainda não revelada.</div>` : ''}
      <div style="font-size:24px;font-weight:700;text-transform:uppercase;margin-bottom:10px">Entregas (${imgCount})</div>
      ${feed}`;
    document.getElementById('season-modal').classList.remove('hidden');
  }

  function closeSeasonDetail() {
    document.getElementById('season-modal').classList.add('hidden');
  }

  init();
  initSkrillWalker();
  </script>
</body>
</html>

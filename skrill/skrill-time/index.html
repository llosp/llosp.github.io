<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SKRILL — Skrill Time</title>
  <link rel="icon" type="image/x-icon" href="/skrill/favicon.ico"/>
  <link rel="stylesheet" href="/skrill/css/style.css"/>
</head>
<body>
  <div class="orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
  <div class="app-layout">
    <div id="sidebar-root"></div>
    <main class="main-content">
      <div class="page-inner">
        <div id="app" class="center-screen"><div class="spinner"></div></div>
      </div>
    </main>
    <div id="mobile-nav-root"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/skrill/js/bounties.js"></script>
  <script src="/skrill/js/client.js"></script>
  <script>
  if (!isAppUnlocked()) { window.location.href = '/skrill/login/'; }
  else if (!getStoredProfile()) { window.location.href = '/skrill/select-profile/'; }

  let stored            = null;
  let currentWeek       = null;
  let allProfiles       = [];
  let allProfilesFull   = [];
  let participantIds    = new Set();
  let readyIds          = new Set();
  let weekGoals         = [];
  let realtimeCh        = null;
  let countdownInterval = null;
  let pollInterval      = null;
  let lastSig           = '';
  let revealShown       = false;
  let myRatings         = new Map();   // goal_id -> int (my own allocations)
  let myUsed            = 0;
  let mySubmitted       = false;
  let submissionIds     = new Set();   // profile_ids that have finalized
  let bonusByGoal       = new Map();   // goal_id -> sum of all bonuses (post-close)
  let bountySubs        = [];          // bounty submissions for this week (with profile)
  let finalizing        = false;
  let myReports         = new Set();   // goal_ids que eu denunciei
  let reportsByGoal     = new Map();   // goal_id -> Set de reporter_ids
  let myBountyReports   = new Set();   // submission_ids de bounty que eu denunciei
  let bountyReportsBySub = new Map();  // submission_id -> Set de reporter_ids
  let botIds            = new Set();   // profile_ids que sao bots (nao votam/denunciam)
  let attemptVotes      = new Map();   // goal_id -> [{ voter_id, vote }]
  let myAttemptVotes    = new Map();   // goal_id -> 'up'|'down'
  let attemptSubmissionIds = new Set();// voter_ids que confirmaram os votos de tentativa
  let myAttemptSubmitted   = false;

  async function init() {
    stored = requireAuth();
    if (!stored) return;

    const [{ data: me }, { data: week }, { data: profiles }] = await Promise.all([
      sb.from('profiles').select('*').eq('id', stored.id).single(),
      sb.from('weeks').select('*').eq('is_current', true).maybeSingle(),
      sb.from('profiles').select('*').order('name'),
    ]);

    if (me) setStoredProfile(me);
    stored = me ?? stored;

    document.getElementById('sidebar-root').innerHTML = renderSidebar(me, 'skrill-time');
    document.getElementById('mobile-nav-root').innerHTML = renderMobileNav('skrill-time');

    currentWeek     = week;
    allProfilesFull = profiles ?? [];

    if (week) await loadWeekState();

    subscribeRealtime();
    startPolling();
    renderPage();
  }

  async function loadWeekState() {
    const [
      { data: ready },
      { data: goals },
      { data: participants },
      { data: myR },
      { data: subs },
      { data: allR },
      { data: bsubs },
      { data: reportRows },
      { data: bountyReportRows },
      { data: attemptVoteRows },
      { data: attemptSubRows },
    ] = await Promise.all([
      sb.from('week_ready').select('*').eq('week_id', currentWeek.id),
      sb.from('goals').select('*, profile:profiles(*)').eq('week_id', currentWeek.id),
      sb.from('season_participants').select('profile_id').eq('week_id', currentWeek.id),
      sb.from('peer_ratings').select('goal_id,amount').eq('week_id', currentWeek.id).eq('rater_id', stored.id),
      sb.from('peer_rating_submissions').select('rater_id').eq('week_id', currentWeek.id),
      sb.from('peer_ratings').select('goal_id,amount').eq('week_id', currentWeek.id),
      sb.from('bounty_submissions').select('*, profile:profiles(*)').eq('week_id', currentWeek.id).order('created_at', { ascending: false }),
      sb.from('delivery_reports').select('goal_id,reporter_id').eq('week_id', currentWeek.id),
      sb.from('bounty_reports').select('submission_id,reporter_id').eq('week_id', currentWeek.id),
      sb.from('attempt_votes').select('goal_id,voter_id,vote').eq('week_id', currentWeek.id),
      sb.from('attempt_vote_submissions').select('voter_id').eq('week_id', currentWeek.id),
    ]);
    readyIds       = new Set((ready ?? []).map(r => r.profile_id));
    weekGoals      = goals ?? [];
    participantIds = new Set((participants ?? []).map(p => p.profile_id));
    allProfiles    = allProfilesFull.filter(p => participantIds.has(p.id));
    botIds         = new Set(allProfilesFull.filter(p => p.is_bot).map(p => p.id));

    myRatings = new Map();
    myUsed = 0;
    for (const r of (myR ?? [])) {
      myRatings.set(r.goal_id, r.amount);
      myUsed += r.amount;
    }

    submissionIds = new Set((subs ?? []).map(s => s.rater_id));
    mySubmitted = submissionIds.has(stored.id);

    bonusByGoal = new Map();
    for (const r of (allR ?? [])) {
      bonusByGoal.set(r.goal_id, (bonusByGoal.get(r.goal_id) ?? 0) + r.amount);
    }

    bountySubs = (bsubs ?? []).filter(s => participantIds.has(s.profile_id) && !s.canceled);

    myReports = new Set();
    reportsByGoal = new Map();
    for (const r of (reportRows ?? [])) {
      if (r.reporter_id === stored.id) myReports.add(r.goal_id);
      if (!reportsByGoal.has(r.goal_id)) reportsByGoal.set(r.goal_id, new Set());
      reportsByGoal.get(r.goal_id).add(r.reporter_id);
    }

    myBountyReports = new Set();
    bountyReportsBySub = new Map();
    for (const r of (bountyReportRows ?? [])) {
      if (r.reporter_id === stored.id) myBountyReports.add(r.submission_id);
      if (!bountyReportsBySub.has(r.submission_id)) bountyReportsBySub.set(r.submission_id, new Set());
      bountyReportsBySub.get(r.submission_id).add(r.reporter_id);
    }

    attemptVotes = new Map();
    myAttemptVotes = new Map();
    for (const v of (attemptVoteRows ?? [])) {
      if (!attemptVotes.has(v.goal_id)) attemptVotes.set(v.goal_id, []);
      attemptVotes.get(v.goal_id).push({ voter_id: v.voter_id, vote: v.vote });
      if (v.voter_id === stored.id) myAttemptVotes.set(v.goal_id, v.vote);
    }

    attemptSubmissionIds = new Set((attemptSubRows ?? []).map(s => s.voter_id));
    myAttemptSubmitted   = attemptSubmissionIds.has(stored.id);
  }

  function subscribeRealtime() {
    if (realtimeCh) realtimeCh.unsubscribe();
    realtimeCh = sb.channel('skrill-time-ch')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'week_ready' }, () => reload())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'season_participants' }, () => reload())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'peer_ratings' }, () => reload())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'peer_rating_submissions' }, () => reload())
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'weeks' }, payload => {
        if (payload.new?.id === currentWeek?.id) reload();
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'delivery_reports' }, () => reload())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'bounty_reports' }, () => reload())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'bounty_submissions' }, () => reload())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'attempt_votes' }, () => reload())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'attempt_vote_submissions' }, () => reload())
      .subscribe();
  }

  function stateSignature() {
    const totalReports = [...reportsByGoal.values()].reduce((s, v) => s + v.size, 0);
    const totalBountyReports = [...bountyReportsBySub.values()].reduce((s, v) => s + v.size, 0);
    const totalAttemptVotes = [...attemptVotes.values()].reduce((s, v) => s + v.length, 0);
    const awarded = weekGoals.filter(g => g.points_awarded).length;
    const consol  = weekGoals.filter(g => g.attempt_pts_awarded).length;
    return `${currentWeek?.skrill_time_revealed}|${readyIds.size}|${submissionIds.size}|${weekGoals.length}|${bountySubs.length}|${totalReports}|${totalBountyReports}|${totalAttemptVotes}|${attemptSubmissionIds.size}|${awarded}|${consol}`;
  }

  function startPolling() {
    if (pollInterval) clearInterval(pollInterval);
    pollInterval = setInterval(reloadQuiet, 4000);
  }

  async function reload() {
    if (!currentWeek) return;
    const { data: week } = await sb.from('weeks').select('*').eq('id', currentWeek.id).single();
    if (week) currentWeek = week;
    await loadWeekState();
    renderPage();
  }

  // Poll de segurança: refaz o estado, mas só re-renderiza quando algo mudou
  // (evita reanimar o reveal e atrapalhar a avaliação em andamento).
  async function reloadQuiet() {
    if (document.visibilityState !== 'visible' || !currentWeek) return;
    const { data: week } = await sb.from('weeks').select('*').eq('id', currentWeek.id).single();
    if (week) currentWeek = week;
    await loadWeekState();
    if (stateSignature() !== lastSig) renderPage();
  }

  function isSkrillDay() {
    if (!currentWeek?.end_date) return true;
    const t = new Date();
    const todayStr = t.getFullYear() + '-' +
      String(t.getMonth() + 1).padStart(2, '0') + '-' +
      String(t.getDate()).padStart(2, '0');
    return todayStr >= currentWeek.end_date;
  }

  function renderPage() {
    if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }

    const app = document.getElementById('app');
    app.classList.remove('center-screen');
    const week = currentWeek;

    if (!week) {
      app.innerHTML = `<div style="width:100%">
        <div class="page-header">
          <div>
            <div class="page-header-label" style="display:flex;align-items:center;gap:8px"><img src="/skrill/img/Skrill_time.svg" alt="skrill-time" style="width:24px;height:24px"> Reuniao</div>
            <h1 class="page-header-title">Skrill Time</h1>
          </div>
        </div>
        ${renderNoWeekBanner()}
      </div>`;
      return;
    }

    const canAdvance = canAdvanceSeason(week, participantIds, allProfilesFull);

    if (!participantIds.has(stored.id)) {
      app.innerHTML = week.skrill_time_revealed
        ? renderClosedScreen(week, canAdvance)
        : renderSeasonLocked(week, stored, '[S] Reuniao', 'Skrill Time');
      return;
    }

    const revealed = week?.skrill_time_revealed ?? false;
    const total    = allProfiles.length;
    const count    = readyIds.size;
    const allReady = total > 0 && count >= total;
    const iReady   = readyIds.has(stored.id);
    const isSkDay  = isSkrillDay();
    const allRatingsSubmitted = total > 0 && [...participantIds].every(id => submissionIds.has(id));
    const hasAttempts = weekGoals.some(g => g.status === 'attempted' && participantIds.has(g.profile_id));
    const allAttemptsConfirmed = !hasAttempts || (total > 0 && [...participantIds].every(id => attemptSubmissionIds.has(id)));
    const closed   = revealed && allRatingsSubmitted && allAttemptsConfirmed;

    let body = '';
    if (!closed) revealShown = false;
    if (!revealed) {
      if (!isSkDay) {
        body = `
          <div class="card" style="margin-bottom:20px">
            <div class="card-body countdown-wrap">
              <div id="countdown-subtext" class="countdown-dynamic-title"></div>
              <div class="countdown-row" id="countdown-display"></div>
              <div class="countdown-sub">Temporada ${week.week_number} · ${week.year}</div>
            </div>
          </div>`;
      } else {
        const squares = allProfiles.map(p => `
          <div class="ready-square ${readyIds.has(p.id) ? 'on' : ''}" title="${p.name}"></div>
        `).join('');
        body = `
          <div class="card" style="margin-bottom:20px">
            <div class="card-body" style="padding:20px;text-align:center">
              <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px">
                ${squares}
              </div>
              <div style="font-size:28px;font-weight:700;color:var(--text-muted);margin-bottom:20px;text-transform:uppercase">
                ${count} / ${total} prontos
              </div>
              ${!iReady ? `
                <button class="btn btn-primary" style="font-size:26px;padding:14px 32px" onclick="markReady()">
                  Marcar Pronto
                </button>
              ` : `
                <div style="display:flex;flex-direction:column;align-items:center;gap:12px">
                  <div style="font-size:24px;color:var(--amber);font-weight:700;text-transform:uppercase">
                    Voce esta pronto! Aguardando os outros...
                  </div>
                  <button class="btn btn-ghost" style="font-size:22px;padding:10px 24px;opacity:0.7" onclick="unmarkReady()">
                    Desmarcar Pronto
                  </button>
                </div>
              `}
              ${allReady ? `<div style="font-size:24px;color:#22c55e;margin-top:12px;font-weight:700">Todos prontos! Revelando...</div>` : ''}
            </div>
          </div>`;
      }
    } else if (!allRatingsSubmitted) {
      body = renderRatingPhase();
    } else if (!allAttemptsConfirmed) {
      body = renderAttemptVotePhase();
    } else {
      const animate = !revealShown;
      revealShown = true;
      if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
      body = renderReveal(animate);
    }

    app.innerHTML = `
      <div style="width:100%">
        <div class="page-header">
          <div>
            <div class="page-header-label" style="display:flex;align-items:center;gap:8px"><img src="/skrill/img/Skrill_time.svg" alt="skrill-time" style="width:24px;height:24px"> Reuniao</div>
            <h1 class="page-header-title">Skrill Time</h1>
            ${week ? `<div style="font-size:24px;color:var(--text-muted);margin-top:6px;text-transform:uppercase;">
              Temporada ${week.week_number} · ${week.year}
            </div>` : ''}
          </div>
        </div>
        ${body}
      </div>`;

    lastSig = stateSignature();
    if (!revealed && !isSkDay) startCountdown();
  }

  function countdownLabel(diff) {
    const days  = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const mins  = Math.floor((diff % 3600000)  / 60000);
    if (days > 1)    return `faltam ${days} dias pro Skrill Day`;
    if (days === 1)  return `falta 1 dia pro Skrill Day`;
    if (hours > 1)   return `faltam ${hours} horas pro Skrill Day`;
    if (hours === 1) return `falta 1 hora pro Skrill Day`;
    if (mins > 1)    return `faltam ${mins} minutos pro Skrill Day`;
    if (mins === 1)  return `falta 1 minuto pro Skrill Day`;
    return `e ja ja e Skrill Day!`;
  }

  function startCountdown() {
    const target = new Date(currentWeek.end_date + 'T00:00:00');

    function tick() {
      const el  = document.getElementById('countdown-display');
      const sub = document.getElementById('countdown-subtext');
      if (!el) { clearInterval(countdownInterval); countdownInterval = null; return; }
      const diff = target - new Date();
      if (diff <= 0) {
        clearInterval(countdownInterval); countdownInterval = null;
        renderPage();
        return;
      }
      const days    = Math.floor(diff / 86400000);
      const hours   = Math.floor((diff % 86400000) / 3600000);
      const minutes = Math.floor((diff % 3600000)  / 60000);
      const seconds = Math.floor((diff % 60000)    / 1000);
      const pad     = n => String(n).padStart(2, '0');
      if (sub) sub.textContent = countdownLabel(diff);
      el.innerHTML = `
        <span class="cd-num">${pad(days)}</span>
        <span class="cd-sep">:</span>
        <span class="cd-num">${pad(hours)}</span>
        <span class="cd-sep">:</span>
        <span class="cd-num">${pad(minutes)}</span>
        <span class="cd-sep">:</span>
        <span class="cd-num">${pad(seconds)}</span>`;
    }
    tick();
    countdownInterval = setInterval(tick, 1000);
  }

  function deliveredGoals() {
    return weekGoals.filter(g => g.status === 'completed' && participantIds.has(g.profile_id));
  }

  // Quantos votos de denúncia cancelam uma entrega/bounty: todos os participantes
  // exceto o dono e os bots (que nunca denunciam).
  function reportThreshold(ownerId) {
    return [...participantIds].filter(id => id !== ownerId && !botIds.has(id)).length;
  }

  // Seção de entregas da Bounty no Skrill Time (sem stepper de avaliação).
  // showPoints = true na fase de revelação (exibe os pontos calculados por contagem).
  // Fora do reveal (showPoints=false) permite denunciar bounties.
  function renderBountySection(showPoints) {
    if (!currentWeek?.bounty_title || !bountySubs.length) return '';
    const allowReport = !showPoints;
    const bpts = (typeof bountyPointsFor === 'function') ? bountyPointsFor(bountySubs.length) : 0;
    const cards = bountySubs.map(s => {
      const profile = s.profile;
      const imgs = s.image_urls ?? [];
      const isMine = s.profile_id === stored.id;
      const reportCount = bountyReportsBySub.get(s.id)?.size ?? 0;
      const reportNeeded = reportThreshold(s.profile_id);
      const alreadyReported = myBountyReports.has(s.id);
      return `
        <div class="rating-card">
          ${allowReport && !isMine ? `<button class="report-btn${alreadyReported ? ' reported' : ''}" onclick="reportBounty('${s.id}')" title="Denunciar bounty (${reportCount}/${reportNeeded})" ${alreadyReported ? 'disabled' : ''}>
            <img src="/skrill/img/attention.svg" alt="denunciar" style="width:18px;height:18px">
          </button>` : ''}
          <div class="rating-card-head">
            ${profile ? avatarHTML(profile) : ''}
            <div style="flex:1;min-width:0">
              <div style="font-size:22px;color:var(--text-muted);text-transform:uppercase">${profile?.name ?? '?'}</div>
              <div style="font-size:26px;font-weight:700">${currentWeek.bounty_title}</div>
            </div>
            ${showPoints ? `<span class="xp-earned">+${bpts}pts</span>` : ''}
          </div>
          ${imgs.length ? `<div class="delivery-images">
            ${imgs.map(u => `<div class="bounty-img-wrap"><img class="reveal-img" src="${u}" alt="bounty">${profile ? avatarHTML(profile, 'avatar-corner') : ''}</div>`).join('')}
          </div>` : ''}
        </div>`;
    }).join('');

    return `
      <div class="card bounty-card" style="margin-bottom:14px">
        <div class="bounty-head">
          <img src="/skrill/img/bounty.svg" alt="bounty" style="width:24px;height:24px">
          <span class="bounty-label">Bounty</span>
        </div>
        <div class="bounty-title">${currentWeek.bounty_title}</div>
        ${currentWeek.bounty_description ? `<div class="bounty-desc" style="margin-bottom:12px">${currentWeek.bounty_description}</div>` : ''}
        ${cards}
      </div>`;
  }

  function renderRatingPhase() {
    const goals = deliveredGoals();
    const bonusTotal = bonusPoolFor(allProfiles.length);
    const remaining = bonusTotal - myUsed;

    if (!goals.length) {
      // Sem entregas para avaliar. Permite confirmar (rating vazio) para seguir
      // ao restante do fluxo (tentativas / reveal) sem depender do admin.
      if (mySubmitted) return `${renderBountySection(false)}${renderWaitingForOthers(goals)}`;
      const adminBtn = isAdmin() ? `<div style="margin-top:10px"><button class="btn btn-ghost btn-sm" onclick="forceFinalize()">Admin: forçar encerramento</button></div>` : '';
      return `
        ${renderBountySection(false)}
        <div class="card" style="padding:36px 20px;text-align:center">
          <div style="font-size:30px;font-weight:700;margin-bottom:8px">Nenhuma entrega esta temporada</div>
          <div style="font-size:22px;color:var(--text-muted);text-transform:uppercase;margin-bottom:14px">Nada para avaliar.</div>
          <button class="btn btn-primary" style="font-size:24px;padding:10px 28px" onclick="skipRatings()">Continuar</button>
          ${adminBtn}
        </div>`;
    }

    if (mySubmitted) return `${renderBountySection(false)}${renderWaitingForOthers(goals)}`;

    const goalsHTML = goals.map(g => {
      const profile = g.profile;
      const cur = myRatings.get(g.id) ?? 0;
      const imgs = g.image_urls ?? [];
      const isMine = g.profile_id === stored.id;
      const reportCount  = reportsByGoal.get(g.id)?.size ?? 0;
      const reportNeeded = reportThreshold(g.profile_id);
      const alreadyReported = myReports.has(g.id);
      return `
        <div class="rating-card">
          ${!isMine ? `<button class="report-btn${alreadyReported ? ' reported' : ''}" onclick="reportDelivery('${g.id}')" title="Denunciar entrega (${reportCount}/${reportNeeded})" ${alreadyReported ? 'disabled' : ''}>
            <img src="/skrill/img/attention.svg" alt="denunciar" style="width:18px;height:18px">
          </button>` : ''}
          <div class="rating-card-head">
            ${profile ? avatarHTML(profile) : ''}
            <div style="flex:1;min-width:0">
              <div style="font-size:22px;color:var(--text-muted);text-transform:uppercase">
                ${profile?.name ?? '?'} ${isMine ? '· você' : ''}
              </div>
              <div style="font-size:26px;font-weight:700">${g.title}</div>
              <div style="font-size:20px;color:var(--text-muted);margin-top:2px">
                ${difficultyChip(g.difficulty)} · base ${basePoints(g.difficulty)}pts
              </div>
            </div>
            <div class="rating-stepper">
              <button class="btn btn-sm btn-ghost" ${cur <= 0 ? 'disabled' : ''} onclick="decRating('${g.id}')">−</button>
              <div class="rating-value">${cur}</div>
              <button class="btn btn-sm btn-primary" ${remaining <= 0 ? 'disabled' : ''} onclick="incRating('${g.id}')">+</button>
            </div>
          </div>
          ${imgs.length ? `<div class="delivery-images">
            ${imgs.map(u => `<img class="reveal-img" src="${u}" alt="entrega">`).join('')}
          </div>` : ''}
        </div>`;
    }).join('');

    const canSubmit = myUsed === bonusTotal;
    return `
      ${renderBountySection(false)}
      <div class="card" style="margin-bottom:14px">
        <div class="card-header">
          <div class="card-title">Avaliação por pares</div>
          <div style="font-size:22px;font-weight:700">${myUsed} / ${bonusTotal} pts</div>
        </div>
        <div class="card-body" style="padding:14px">
          <div style="font-size:22px;color:var(--text-muted);text-transform:uppercase;margin-bottom:14px">
            Distribua seus ${bonusTotal} pontos bônus entre as entregas. Você pode dar para si mesmo.
            Distribuição anônima.
          </div>
          ${goalsHTML}
          <div style="text-align:center;margin-top:18px">
            <button id="rating-submit" class="btn btn-primary" style="font-size:26px;padding:12px 32px"
              ${canSubmit ? '' : 'disabled'} onclick="submitRatings()">
              Enviar avaliação
            </button>
            ${!canSubmit ? `<div style="font-size:20px;color:var(--text-muted);margin-top:8px;text-transform:uppercase">Distribua todos os ${bonusTotal} pontos para enviar</div>` : ''}
          </div>
        </div>
      </div>`;
  }

  function renderWaitingForOthers(goals) {
    const squares = allProfiles.map(p => `
      <div class="ready-square ${submissionIds.has(p.id) ? 'on' : ''}" title="${p.name}"></div>
    `).join('');
    const adminBtn = isAdmin() ? `
      <div style="margin-top:18px">
        <button class="btn btn-ghost btn-sm" onclick="forceFinalize()">Admin: forçar encerramento</button>
      </div>` : '';
    return `
      <div class="card">
        <div class="card-body" style="padding:24px;text-align:center">
          <div style="font-size:28px;font-weight:700;margin-bottom:12px;text-transform:uppercase">Avaliação enviada</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px">${squares}</div>
          <div style="font-size:24px;color:var(--text-muted);text-transform:uppercase">

          ${adminBtn}
        </div>
      </div>`;

  function renderReveal(animate = false) {
    if (animate && typeof fireConfetti === 'function') setTimeout(fireConfetti, 250);
    const completedGoals = deliveredGoals();
    const byMember = new Map();
    for (const p of allProfiles) byMember.set(p.id, { profile: p, goals: [] });
    for (const g of completedGoals) {
      if (byMember.has(g.profile_id)) byMember.get(g.profile_id).goals.push(g);
    }

    const memberBlocks = [...byMember.values()].map(({ profile, goals: mGoals }) => {
      const totalPts = mGoals.reduce((s, g) => {
        const base = basePoints(g.difficulty);
        const bonus = bonusByGoal.get(g.id) ?? 0;
        return s + base + bonus;
      }, 0);
      const goalsHTML = mGoals.map(g => {
        const imgs = g.image_urls ?? [];
        const base = basePoints(g.difficulty);
        const bonus = bonusByGoal.get(g.id) ?? 0;
        return `
          <div style="margin-bottom:12px">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap">
              <span style="font-size:24px">${SVG_CHECK}</span>
              <span style="font-size:24px;font-weight:700">${g.title}</span>
              ${difficultyChip(g.difficulty)}
              <span style="margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap">
                <span class="badge" style="background:#D6EAF8;color:var(--blue);border-color:var(--blue)">base +${base}</span>
                ${bonus > 0 ? `<span class="badge" style="background:var(--amber-light);color:var(--amber-deep);border-color:var(--amber-dark)">bônus +${bonus}</span>` : ''}
                <span class="xp-earned">= ${base + bonus}pts</span>
              </span>
            </div>
            ${imgs.length ? `<div class="delivery-images">
              ${imgs.map(u => `<img class="reveal-img" src="${u}" alt="entrega">`).join('')}
            </div>` : ''}
          </div>`;
      }).join('');

      return `
        <div class="reveal-member-block" style="margin-bottom:16px">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)">
            ${avatarHTML(profile, 'avatar-md')}
            <div style="flex:1">
              <div style="font-size:28px;font-weight:700">${profile.name}</div>
              <div style="font-size:24px;color:var(--text-muted)">${mGoals.length} meta${mGoals.length !== 1 ? 's' : ''} entregue${mGoals.length !== 1 ? 's' : ''}</div>
            </div>
            <div style="font-size:32px;font-weight:700;color:var(--amber)">${totalPts}pts</div>
          </div>
          ${mGoals.length ? goalsHTML : `<div style="font-size:24px;color:var(--text-muted);text-align:center;padding:8px">Nenhuma meta entregue esta temporada</div>`}
        </div>`;
    });

    const grandTotal = completedGoals.reduce((s, g) => {
      const base = basePoints(g.difficulty);
      return s + base + (bonusByGoal.get(g.id) ?? 0);
    }, 0);
    const nextNum  = currentWeek.week_number + 1;
    const nextYear = nextNum > 52 ? currentWeek.year + 1 : currentWeek.year;
    const nextDisp = nextNum > 52 ? 1 : nextNum;

    const canAdvance = canAdvanceSeason(currentWeek, participantIds, allProfilesFull);
    const advanceBtn = canAdvance ? `
      <div style="margin-top:20px;padding-top:20px;border-top:2px dashed var(--border);text-align:center">
        <div style="font-size:22px;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase">
          Temporada ${currentWeek.week_number} concluida
        </div>
        <div style="font-size:20px;color:var(--text-muted);margin-bottom:14px">
          Clique para encerrar esta temporada e abrir a Temporada ${nextDisp} · ${nextYear} para todos.
        </div>
        <button class="btn btn-primary" style="font-size:24px;padding:12px 32px" onclick="openAdvanceSeasonModal(currentWeek)">
          Encerrar e iniciar Temporada ${nextDisp}
        </button>
      </div>` : '';

    const bountyHTML = renderBountySection(true);
    const items = (bountyHTML ? [bountyHTML] : []).concat(memberBlocks);
    const bodyHTML = items.map((html, i) => animate
      ? `<div class="reveal-rise" style="animation-delay:${(i * 0.12).toFixed(2)}s">${html}</div>`
      : html
    ).join('');

    return `
      <div class="card">
        <div class="card-header">
          <div class="card-title">Resultados da Temporada</div>
          <div style="font-size:24px;font-weight:700;color:var(--amber)">${grandTotal}pts total</div>
        </div>
        <div class="card-body" style="padding:16px">${bodyHTML}</div>
      </div>
      ${renderAttemptSection(animate)}
      ${advanceBtn}`;
  }

  // Seção de tentativas no REVEAL — somente leitura: mostra contagem final de
  // votos e o badge de consolação (concedido no encerramento). Sem botões.
  function renderAttemptSection(animate = false) {
    const attempted = weekGoals.filter(g => g.status === 'attempted' && participantIds.has(g.profile_id));
    if (!attempted.length) return '';

    const cards = attempted.map((g, i) => {
      const profile     = g.profile;
      const votes       = attemptVotes.get(g.id) ?? [];
      const upCount     = votes.filter(v => v.vote === 'up').length;
      const downCount   = votes.filter(v => v.vote === 'down').length;
      const imgs        = g.attempt_images ?? [];
      const awarded     = !!g.attempt_pts_awarded;

      const resultRow = `
        <div style="margin-top:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <span style="font-size:22px;color:var(--green-dark);font-weight:700">&#9650; ${upCount}</span>
          <span style="font-size:22px;color:var(--red);font-weight:700">&#9660; ${downCount}</span>
          ${awarded
            ? `<span class="badge badge-completed" style="font-size:20px">+1pt consolacao</span>`
            : `<span style="font-size:20px;color:var(--text-muted);text-transform:uppercase">sem consolacao</span>`}
        </div>`;

      const cardHTML = `
        <div style="padding:14px 0;${i < attempted.length - 1 ? 'border-bottom:1px solid var(--border);' : ''}">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap">
            ${profile ? avatarHTML(profile) : ''}
            <div style="flex:1;min-width:0">
              <div style="font-size:22px;color:var(--text-muted);text-transform:uppercase">${profile?.name ?? '?'}</div>
              <div style="font-size:24px;font-weight:700">${g.title}</div>
            </div>
            ${difficultyChip(g.difficulty)}
          </div>
          ${g.attempt_text ? `<div class="attempt-reflection">"${g.attempt_text}"</div>` : ''}
          ${imgs.length ? `<div class="delivery-images" style="margin-top:8px">${imgs.map(u => `<img class="reveal-img" src="${u}" alt="tentativa">`).join('')}</div>` : ''}
          ${resultRow}
        </div>`;

      return animate
        ? `<div class="reveal-rise" style="animation-delay:${(i * 0.12).toFixed(2)}s">${cardHTML}</div>`

    }).join('');

    return `
      <div class="card" style="margin-top:14px">
        <div class="card-header">
          <div class="card-title">Tentativas</div>
          <div style="font-size:20px;color:#000;text-transform:uppercase">${attempted.length} tentativa${attempted.length !== 1 ? 's' : ''}</div>
        </div>
        <div class="card-body" style="padding:14px">${cards}</div>
      </div>`;
  }

  // Fase de votação de tentativas (entre o submit de bônus e o reveal). Votos
  // ▲/▼ são desmarcáveis até confirmar. Bônus permanece oculto aqui.
  function renderAttemptVotePhase() {
    const attempted = weekGoals.filter(g => g.status === 'attempted' && participantIds.has(g.profile_id));

    if (myAttemptSubmitted) {
      const squares = allProfiles.map(p => `
        <div class="ready-square ${attemptSubmissionIds.has(p.id) ? 'on' : ''}" title="${p.name}"></div>
      `).join('');
      const adminBtn = isAdmin() ? `
        <div style="margin-top:18px"><button class="btn btn-ghost btn-sm" onclick="forceFinalize()">Admin: forçar encerramento</button></div>` : '';
      return `
        ${renderBountySection(false)}
        <div class="card">
          <div class="card-body" style="padding:24px;text-align:center">
            <div style="font-size:28px;font-weight:700;margin-bottom:12px;text-transform:uppercase">Votos de tentativa enviados</div>
            <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px">${squares}</div>
            <div style="font-size:24px;color:var(--text-muted);text-transform:uppercase">
              ${attemptSubmissionIds.size} / ${allProfiles.length} confirmados
            </div>
            <div style="font-size:22px;color:var(--text-muted);margin-top:8px;text-transform:uppercase">Aguardando os demais...</div>
            ${adminBtn}
          </div>
        </div>`;
    }

    const cards = attempted.map((g, i) => {
      const profile   = g.profile;
      const votes     = attemptVotes.get(g.id) ?? [];
      const upCount   = votes.filter(v => v.vote === 'up').length;
      const downCount = votes.filter(v => v.vote === 'down').length;
      const myVote    = myAttemptVotes.get(g.id);
      const isMine    = g.profile_id === stored.id;
      const imgs      = g.attempt_images ?? [];

      const voteRow = isMine
        ? `<div style="margin-top:10px;font-size:20px;color:var(--text-muted);text-transform:uppercase">Sua tentativa · ${upCount} a favor, ${downCount} contra</div>`
        : `<div style="display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap">
            <button class="vote-btn${myVote === 'up' ? ' voted-up' : ''}" onclick="voteAttempt('${g.id}','up')">&#9650; ${upCount}</button>
            <button class="vote-btn${myVote === 'down' ? ' voted-down' : ''}" onclick="voteAttempt('${g.id}','down')">&#9660; ${downCount}</button>
            <span style="font-size:20px;color:var(--text-muted);text-transform:uppercase">${myVote ? 'Clique de novo para desmarcar' : 'Vote (opcional)'}</span>
          </div>`;

      return `
        <div style="padding:14px 0;${i < attempted.length - 1 ? 'border-bottom:1px solid var(--border);' : ''}">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap">
            ${profile ? avatarHTML(profile) : ''}
            <div style="flex:1;min-width:0">
              <div style="font-size:22px;color:var(--text-muted);text-transform:uppercase">${profile?.name ?? '?'}</div>
              <div style="font-size:24px;font-weight:700">${g.title}</div>
            </div>
            ${difficultyChip(g.difficulty)}
          </div>
          ${g.attempt_text ? `<div class="attempt-reflection">"${g.attempt_text}"</div>` : ''}
          ${imgs.length ? `<div class="delivery-images" style="margin-top:8px">${imgs.map(u => `<img class="reveal-img" src="${u}" alt="tentativa">`).join('')}</div>` : ''}
          ${voteRow}
        </div>`;
    }).join('');

    return `
      ${renderBountySection(false)}
      <div class="card" style="margin-bottom:14px">
        <div class="card-header">
          <div class="card-title">Votação de Tentativas</div>
          <div style="font-size:20px;color:var(--text-muted);text-transform:uppercase">${attempted.length} tentativa${attempted.length !== 1 ? 's' : ''}</div>
        </div>
        <div class="card-body" style="padding:14px">
          <div style="font-size:22px;color:var(--text-muted);text-transform:uppercase;margin-bottom:14px">
            Vote &#9650; nas tentativas que merecem 1 ponto de consolação. O voto é opcional e pode ser desmarcado até confirmar.
            Os resultados dos bônus só aparecem após esta etapa.
          </div>
          ${cards}
          <div style="text-align:center;margin-top:18px">
            <button id="attempt-submit" class="btn btn-primary" style="font-size:26px;padding:12px 32px" onclick="submitAttemptVotes()">
              Confirmar votos
            </button>
          </div>
        </div>
      </div>`;
  }

  // Voto de tentativa toggleável: clicar no mesmo voto desmarca; clicar no outro
  // troca. SEM conceder pontos aqui — a consolação é apurada no encerramento.
  async function voteAttempt(goalId, vote) {
    if (myAttemptSubmitted) return;
    const goal = weekGoals.find(g => g.id === goalId);
    if (!goal || goal.profile_id === stored.id) return;

    const current = myAttemptVotes.get(goalId);

    if (current === vote) {
      // desmarcar
      const { error } = await sb.from('attempt_votes')
        .delete().eq('goal_id', goalId).eq('voter_id', stored.id);
      if (error) { toast('Erro ao desmarcar', '#ef4444'); return; }
      myAttemptVotes.delete(goalId);
    } else {
      // inserir/trocar
      const { error } = await sb.from('attempt_votes').upsert(
        { week_id: currentWeek.id, goal_id: goalId, voter_id: stored.id, vote },
        { onConflict: 'goal_id,voter_id' }
      );
      if (error) { toast('Erro ao votar', '#ef4444'); return; }
      myAttemptVotes.set(goalId, vote);
    }
    await reload();
  }

  async function submitAttemptVotes() {
    if (myAttemptSubmitted) return;
    const btn = document.getElementById('attempt-submit');
    if (btn) { btn.disabled = true; btn.textContent = '...'; }
    const { error } = await sb.from('attempt_vote_submissions').insert({
      week_id: currentWeek.id, voter_id: stored.id,
    });
    if (error && !error.message.includes('duplicate')) {
      toast(error.message, '#ef4444');
      if (btn) { btn.disabled = false; btn.textContent = 'Confirmar votos'; }
      return;
    }
    myAttemptSubmitted = true;
    attemptSubmissionIds.add(stored.id);
    await checkAndAutoClose();
    await reload();
  }

  // Tela para quem NÃO participou, quando a temporada já foi revelada/encerrada
  function renderClosedScreen(week, canAdvance) {
    const nextNum = week.week_number + 1 > 52 ? 1 : week.week_number + 1;
    const advance = canAdvance
      ? `<div style="margin-top:18px">
           <button class="btn btn-primary" style="font-size:24px;padding:12px 32px" onclick="openAdvanceSeasonModal(currentWeek)">
             Iniciar Temporada ${nextNum}
           </button>
         </div>`
      : `<div style="font-size:22px;color:var(--text-muted);margin-top:10px">Aguarde o início da próxima temporada.</div>`;
    return `
      <div style="width:100%">
        <div class="page-header">
          <div>
            <div class="page-header-label" style="display:flex;align-items:center;gap:8px"><img src="/skrill/img/Skrill_time.svg" alt="skrill-time" style="width:24px;height:24px"> Reuniao</div>
            <h1 class="page-header-title">Skrill Time</h1>
          </div>
        </div>
        <div class="card" style="text-align:center;padding:40px 20px">
          <div style="font-size:32px;font-weight:700;margin-bottom:6px">Temporada ${week.week_number} encerrada</div>
          <div style="font-size:24px;color:var(--text-muted)">Voce nao participou desta temporada.</div>
          ${advance}
        </div>
      </div>`;

  async function markReady() {
    if (!currentWeek) return;
    const btn = document.querySelector('[onclick="markReady()"]');
    if (btn) { btn.disabled = true; btn.textContent = '...'; }

    const { error } = await sb.from('week_ready').insert({
      week_id:    currentWeek.id,
      profile_id: stored.id,
    });

    if (error && !error.message.includes('duplicate')) {
      if (btn) { btn.disabled = false; btn.textContent = 'Marcar Pronto'; }
      return;
    }

    readyIds.add(stored.id);

    const { count } = await sb.from('week_ready')
      .select('*', { count: 'exact', head: true })
      .eq('week_id', currentWeek.id);

    if (count >= allProfiles.length && allProfiles.length > 0) {
      await sb.from('weeks').update({ skrill_time_revealed: true }).eq('id', currentWeek.id);
      currentWeek = { ...currentWeek, skrill_time_revealed: true };
    }

    await reload();
  }

  async function unmarkReady() {
    if (!currentWeek) return;
    const btn = document.querySelector('[onclick="unmarkReady()"]');
    if (btn) { btn.disabled = true; btn.textContent = '...'; }

    await sb.from('week_ready')
      .delete()
      .eq('week_id', currentWeek.id)
      .eq('profile_id', stored.id);

    readyIds.delete(stored.id);
    renderPage();
  }

  async function incRating(goalId) {
    if (mySubmitted) return;
    const bonusTotal = bonusPoolFor(allProfiles.length);
    if (myUsed >= bonusTotal) return;
    const cur = (myRatings.get(goalId) ?? 0) + 1;
    myRatings.set(goalId, cur);
    myUsed++;
    await sb.from('peer_ratings').upsert(
      { week_id: currentWeek.id, rater_id: stored.id, goal_id: goalId, amount: cur },
      { onConflict: 'week_id,rater_id,goal_id' }
    );
    renderPage();
  }

  async function decRating(goalId) {
    if (mySubmitted) return;
    const cur = myRatings.get(goalId) ?? 0;
    if (cur <= 0) return;
    const next = cur - 1;
    myRatings.set(goalId, next);
    myUsed--;
    await sb.from('peer_ratings').upsert(
      { week_id: currentWeek.id, rater_id: stored.id, goal_id: goalId, amount: next },
      { onConflict: 'week_id,rater_id,goal_id' }
    );
    renderPage();
  }

  async function submitRatings() {
    if (mySubmitted) return;
    const bonusTotal = bonusPoolFor(allProfiles.length);
    if (myUsed !== bonusTotal) return;
    const btn = document.getElementById('rating-submit');
    if (btn) { btn.disabled = true; btn.textContent = '...'; }
    const { error } = await sb.from('peer_rating_submissions').insert({
      week_id: currentWeek.id, rater_id: stored.id,
    });
    if (error && !error.message.includes('duplicate')) {
      toast(error.message, '#ef4444');
      if (btn) { btn.disabled = false; btn.textContent = 'Enviar avaliação'; }
      return;
    }
    mySubmitted = true;
    submissionIds.add(stored.id);
    await checkAndAutoClose();
    await reload();
  }

  // Confirma sem avaliar (usado quando não há entregas para pontuar).
  async function skipRatings() {
    if (mySubmitted) return;
    const { error } = await sb.from('peer_rating_submissions').insert({
      week_id: currentWeek.id, rater_id: stored.id,
    });
    if (error && !error.message.includes('duplicate')) {
      toast(error.message, '#ef4444');
      return;
    }
    mySubmitted = true;
    submissionIds.add(stored.id);
    await checkAndAutoClose();
    await reload();
  }

  async function checkAndAutoClose() {
    if (!currentWeek || finalizing) return;
    // 1. todos enviaram a avaliação por pares?
    const { data: subs } = await sb.from('peer_rating_submissions')
      .select('rater_id').eq('week_id', currentWeek.id);
    const sIds = new Set((subs ?? []).map(s => s.rater_id));
    const ratingsDone = allProfiles.length > 0 && allProfiles.every(p => sIds.has(p.id));
    if (!ratingsDone) return;
    // 2. se há tentativas, todos confirmaram os votos de tentativa?
    const hasAttempts = weekGoals.some(g => g.status === 'attempted' && participantIds.has(g.profile_id));
    if (hasAttempts) {
      const { data: asubs } = await sb.from('attempt_vote_submissions')
        .select('voter_id').eq('week_id', currentWeek.id);
      const aIds = new Set((asubs ?? []).map(s => s.voter_id));
      if (!allProfiles.every(p => aIds.has(p.id))) return;
    }
    // 3. idempotência: já finalizado?
    const { data: anyAwarded } = await sb.from('goals')
      .select('id').eq('week_id', currentWeek.id).eq('points_awarded', true).limit(1);
    if (anyAwarded?.length) return;
    finalizing = true;
    try { await finalizeSeason(); }
    finally { finalizing = false; }
  }

  async function reportDelivery(goalId) {
    if (myReports.has(goalId)) return;
    const goal = weekGoals.find(g => g.id === goalId);
    if (!goal || goal.profile_id === stored.id) return;

    const { error } = await sb.from('delivery_reports').insert({
      week_id:     currentWeek.id,
      goal_id:     goalId,
      reporter_id: stored.id,
    });
    if (error && !error.message.includes('duplicate')) {
      toast('Erro ao denunciar', '#ef4444');
      return;
    }
    myReports.add(goalId);

    // Verifica se o limiar foi atingido (todos exceto o dono e bots denunciaram)
    const { data: reports } = await sb.from('delivery_reports')
      .select('reporter_id').eq('goal_id', goalId);
    const threshold = reportThreshold(goal.profile_id);
    if ((reports?.length ?? 0) >= threshold && threshold > 0) {
      await sb.from('goals').update({ status: 'failed' }).eq('id', goalId);
      toast('Entrega cancelada por unanimidade', '#ef4444');
    }

    await reload();
  }

  async function reportBounty(submissionId) {
    if (myBountyReports.has(submissionId)) return;
    const sub = bountySubs.find(s => s.id === submissionId);
    if (!sub || sub.profile_id === stored.id) return;

    const { error } = await sb.from('bounty_reports').insert({
      week_id:       currentWeek.id,
      submission_id: submissionId,
      reporter_id:   stored.id,
    });
    if (error && !error.message.includes('duplicate')) {
      toast('Erro ao denunciar', '#ef4444');
      return;
    }
    myBountyReports.add(submissionId);

    // Verifica se o limiar foi atingido (todos exceto o dono e bots denunciaram)
    const { data: reports } = await sb.from('bounty_reports')
      .select('reporter_id').eq('submission_id', submissionId);
    const threshold = reportThreshold(sub.profile_id);
    if ((reports?.length ?? 0) >= threshold && threshold > 0) {
      await sb.from('bounty_submissions').update({ canceled: true }).eq('id', submissionId);
      toast('Bounty cancelada por unanimidade', '#ef4444');
    }

    await reload();
  }

  async function forceFinalize() {
    if (!confirm('Forçar encerramento agora? Os pontos serão concedidos imediatamente.')) return;
    finalizing = true;
    try {
      // Mark every participant as submitted (avaliação E tentativas) para a
      // temporada fechar e ir ao reveal, mesmo que alguém não tenha enviado.
      const missing = [...participantIds].filter(id => !submissionIds.has(id));
      if (missing.length) {
        await sb.from('peer_rating_submissions').insert(
          missing.map(id => ({ week_id: currentWeek.id, rater_id: id }))
        );
      }
      const missingAtt = [...participantIds].filter(id => !attemptSubmissionIds.has(id));
      if (missingAtt.length) {
        await sb.from('attempt_vote_submissions').insert(
          missingAtt.map(id => ({ week_id: currentWeek.id, voter_id: id }))
        );
      }
      await finalizeSeason();
    } finally { finalizing = false; }
    await reload();
  }

  async function finalizeSeason() {
    await finalizeSeasonById(currentWeek.id);
  }

  init();
  initSkrillWalker();
  </script>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SKRILL — Skrill Time</title>
  <link rel="icon" type="image/x-icon" href="/skrill/favicon.ico"/>
  <link rel="stylesheet" href="/skrill/css/style.css"/>
</head>
<body>
  <div class="orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
  <div class="app-layout">
    <div id="sidebar-root"></div>
    <main class="main-content">
      <div class="page-inner">
        <div id="app" class="center-screen"><div class="spinner"></div></div>
      </div>
    </main>
    <div id="mobile-nav-root"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/skrill/js/bounties.js"></script>
  <script src="/skrill/js/client.js"></script>
  <script>
  if (!isAppUnlocked()) { window.location.href = '/skrill/login/'; }
  else if (!getStoredProfile()) { window.location.href = '/skrill/select-profile/'; }

  let stored            = null;
  let currentWeek       = null;
  let allProfiles       = [];
  let allProfilesFull   = [];
  let participantIds    = new Set();
  let readyIds          = new Set();
  let weekGoals         = [];
  let realtimeCh        = null;
  let countdownInterval = null;
  let myRatings         = new Map();   // goal_id -> int (my own allocations)
  let myUsed            = 0;
  let mySubmitted       = false;
  let submissionIds     = new Set();   // profile_ids that have finalized
  let bonusByGoal       = new Map();   // goal_id -> sum of all bonuses (post-close)
  let bountySubs        = [];          // bounty submissions for this week (with profile)
  let finalizing        = false;

  async function init() {
    stored = requireAuth();
    if (!stored) return;

    const [{ data: me }, { data: week }, { data: profiles }] = await Promise.all([
      sb.from('profiles').select('*').eq('id', stored.id).single(),
      sb.from('weeks').select('*').eq('is_current', true).maybeSingle(),
      sb.from('profiles').select('*').order('name'),
    ]);

    if (me) setStoredProfile(me);
    stored = me ?? stored;

    document.getElementById('sidebar-root').innerHTML = renderSidebar(me, 'skrill-time');
    document.getElementById('mobile-nav-root').innerHTML = renderMobileNav('skrill-time');

    currentWeek     = week;
    allProfilesFull = profiles ?? [];

    if (week) await loadWeekState();

    renderPage();
    subscribeRealtime();
  }

  async function loadWeekState() {
    const [
      { data: ready },
      { data: goals },
      { data: participants },
      { data: myR },
      { data: subs },
      { data: allR },
      { data: bsubs },
    ] = await Promise.all([
      sb.from('week_ready').select('*').eq('week_id', currentWeek.id),
      sb.from('goals').select('*, profile:profiles(*)').eq('week_id', currentWeek.id),
      sb.from('season_participants').select('profile_id').eq('week_id', currentWeek.id),
      sb.from('peer_ratings').select('goal_id,amount').eq('week_id', currentWeek.id).eq('rater_id', stored.id),
      sb.from('peer_rating_submissions').select('rater_id').eq('week_id', currentWeek.id),
      sb.from('peer_ratings').select('goal_id,amount').eq('week_id', currentWeek.id),
      sb.from('bounty_submissions').select('*, profile:profiles(*)').eq('week_id', currentWeek.id).order('created_at', { ascending: false }),
    ]);
    readyIds       = new Set((ready ?? []).map(r => r.profile_id));
    weekGoals      = goals ?? [];
    participantIds = new Set((participants ?? []).map(p => p.profile_id));
    allProfiles    = allProfilesFull.filter(p => participantIds.has(p.id));

    myRatings = new Map();
    myUsed = 0;
    for (const r of (myR ?? [])) {
      myRatings.set(r.goal_id, r.amount);
      myUsed += r.amount;
    }

    submissionIds = new Set((subs ?? []).map(s => s.rater_id));
    mySubmitted = submissionIds.has(stored.id);

    bonusByGoal = new Map();
    for (const r of (allR ?? [])) {
      bonusByGoal.set(r.goal_id, (bonusByGoal.get(r.goal_id) ?? 0) + r.amount);
    }

    bountySubs = (bsubs ?? []).filter(s => participantIds.has(s.profile_id));
  }

  function subscribeRealtime() {
    if (realtimeCh) realtimeCh.unsubscribe();
    realtimeCh = sb.channel('skrill-time-ch')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'week_ready' }, () => reload())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'season_participants' }, () => reload())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'peer_ratings' }, () => reload())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'peer_rating_submissions' }, () => reload())
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'weeks' }, payload => {
        if (payload.new?.id === currentWeek?.id) {
          currentWeek = { ...currentWeek, ...payload.new };
          renderPage();
        }
      })
      .subscribe();
  }

  async function reload() {
    if (!currentWeek) return;
    const { data: week } = await sb.from('weeks').select('*').eq('id', currentWeek.id).single();
    if (week) currentWeek = week;
    await loadWeekState();
    renderPage();
  }

  function isSkrillDay() {
    if (!currentWeek?.end_date) return true;
    const t = new Date();
    const todayStr = t.getFullYear() + '-' +
      String(t.getMonth() + 1).padStart(2, '0') + '-' +
      String(t.getDate()).padStart(2, '0');
    return todayStr >= currentWeek.end_date;
  }

  function renderPage() {
    if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }

    const app = document.getElementById('app');
    app.classList.remove('center-screen');
    const week = currentWeek;

    if (!week) {
      app.innerHTML = `<div style="width:100%">
        <div class="page-header">
          <div>
            <div class="page-header-label" style="display:flex;align-items:center;gap:8px"><img src="/skrill/img/Skrill_time.svg" alt="skrill-time" style="width:24px;height:24px"> Reuniao</div>
            <h1 class="page-header-title">Skrill Time</h1>
          </div>
        </div>
        ${renderNoWeekBanner()}
      </div>`;
      return;
    }

    const canAdvance = canAdvanceSeason(week, participantIds, allProfilesFull);

    if (!participantIds.has(stored.id)) {
      app.innerHTML = week.skrill_time_revealed
        ? renderClosedScreen(week, canAdvance)
        : renderSeasonLocked(week, stored, '[S] Reuniao', 'Skrill Time');
      return;
    }

    const revealed = week?.skrill_time_revealed ?? false;
    const total    = allProfiles.length;
    const count    = readyIds.size;
    const allReady = total > 0 && count >= total;
    const iReady   = readyIds.has(stored.id);
    const isSkDay  = isSkrillDay();
    const allSubmitted = total > 0 && [...participantIds].every(id => submissionIds.has(id));
    const closed   = revealed && allSubmitted;

    let body = '';
    if (!revealed) {
      if (!isSkDay) {
        body = `
          <div class="card" style="margin-bottom:20px">
            <div class="card-body countdown-wrap">
              <div id="countdown-subtext" class="countdown-dynamic-title"></div>
              <div class="countdown-row" id="countdown-display"></div>
              <div class="countdown-sub">Temporada ${week.week_number} · ${week.year}</div>
            </div>
          </div>`;
      } else {
        const squares = allProfiles.map(p => `
          <div class="ready-square ${readyIds.has(p.id) ? 'on' : ''}" title="${p.name}"></div>
        `).join('');
        body = `
          <div class="card" style="margin-bottom:20px">
            <div class="card-body" style="padding:20px;text-align:center">
              <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px">
                ${squares}
              </div>
              <div style="font-size:28px;font-weight:700;color:var(--text-muted);margin-bottom:20px;text-transform:uppercase">
                ${count} / ${total} prontos
              </div>
              ${!iReady ? `
                <button class="btn btn-primary" style="font-size:26px;padding:14px 32px" onclick="markReady()">
                  Marcar Pronto
                </button>
              ` : `
                <div style="display:flex;flex-direction:column;align-items:center;gap:12px">
                  <div style="font-size:24px;color:var(--amber);font-weight:700;text-transform:uppercase">
                    Voce esta pronto! Aguardando os outros...
                  </div>
                  <button class="btn btn-ghost" style="font-size:22px;padding:10px 24px;opacity:0.7" onclick="unmarkReady()">
                    Desmarcar Pronto
                  </button>
                </div>
              `}
              ${allReady ? `<div style="font-size:24px;color:#22c55e;margin-top:12px;font-weight:700">Todos prontos! Revelando...</div>` : ''}
            </div>
          </div>`;
      }
    } else if (!closed) {
      body = renderRatingPhase();
    } else {
      body = renderReveal();
    }

    app.innerHTML = `
      <div style="width:100%">
        <div class="page-header">
          <div>
            <div class="page-header-label" style="display:flex;align-items:center;gap:8px"><img src="/skrill/img/Skrill_time.svg" alt="skrill-time" style="width:24px;height:24px"> Reuniao</div>
            <h1 class="page-header-title">Skrill Time</h1>
            ${week ? `<div style="font-size:24px;color:var(--text-muted);margin-top:6px;text-transform:uppercase;">
              Temporada ${week.week_number} · ${week.year}
            </div>` : ''}
          </div>
        </div>
        ${body}
      </div>`;

    if (!revealed && !isSkDay) startCountdown();
  }

  function countdownLabel(diff) {
    const days  = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const mins  = Math.floor((diff % 3600000)  / 60000);
    if (days > 1)    return `faltam ${days} dias pro Skrill Day`;
    if (days === 1)  return `falta 1 dia pro Skrill Day`;
    if (hours > 1)   return `faltam ${hours} horas pro Skrill Day`;
    if (hours === 1) return `falta 1 hora pro Skrill Day`;
    if (mins > 1)    return `faltam ${mins} minutos pro Skrill Day`;
    if (mins === 1)  return `falta 1 minuto pro Skrill Day`;
    return `e ja ja e Skrill Day!`;
  }

  function startCountdown() {
    const target = new Date(currentWeek.end_date + 'T00:00:00');

    function tick() {
      const el  = document.getElementById('countdown-display');
      const sub = document.getElementById('countdown-subtext');
      if (!el) { clearInterval(countdownInterval); countdownInterval = null; return; }
      const diff = target - new Date();
      if (diff <= 0) {
        clearInterval(countdownInterval); countdownInterval = null;
        renderPage();
        return;
      }
      const days    = Math.floor(diff / 86400000);
      const hours   = Math.floor((diff % 86400000) / 3600000);
      const minutes = Math.floor((diff % 3600000)  / 60000);
      const seconds = Math.floor((diff % 60000)    / 1000);
      const pad     = n => String(n).padStart(2, '0');
      if (sub) sub.textContent = countdownLabel(diff);
      el.innerHTML = `
        <span class="cd-num">${pad(days)}</span>
        <span class="cd-sep">:</span>
        <span class="cd-num">${pad(hours)}</span>
        <span class="cd-sep">:</span>
        <span class="cd-num">${pad(minutes)}</span>
        <span class="cd-sep">:</span>
        <span class="cd-num">${pad(seconds)}</span>`;
    }
    tick();
    countdownInterval = setInterval(tick, 1000);
  }

  function deliveredGoals() {
    return weekGoals.filter(g => g.status === 'completed' && participantIds.has(g.profile_id));
  }

  // Seção de entregas da Bounty no Skrill Time (sem stepper de avaliação).
  // showPoints = true na fase de revelação (exibe os pontos calculados por contagem).
  function renderBountySection(showPoints) {
    if (!currentWeek?.bounty_title || !bountySubs.length) return '';
    const bpts = (typeof bountyPointsFor === 'function') ? bountyPointsFor(bountySubs.length) : 0;
    const cards = bountySubs.map(s => {
      const profile = s.profile;
      const imgs = s.image_urls ?? [];
      return `
        <div class="rating-card">
          <div class="rating-card-head">
            ${profile ? avatarHTML(profile) : ''}
            <div style="flex:1;min-width:0">
              <div style="font-size:22px;color:var(--text-muted);text-transform:uppercase">${profile?.name ?? '?'}</div>
              <div style="font-size:26px;font-weight:700">${currentWeek.bounty_title}</div>
            </div>
            ${showPoints ? `<span class="xp-earned">+${bpts}pts</span>` : ''}
          </div>
          ${imgs.length ? `<div class="delivery-images">
            ${imgs.map(u => `<div class="bounty-img-wrap"><img class="reveal-img" src="${u}" alt="bounty">${profile ? avatarHTML(profile, 'avatar-corner') : ''}</div>`).join('')}
          </div>` : ''}
        </div>`;
    }).join('');

    return `
      <div class="card bounty-card" style="margin-bottom:14px">
        <div class="bounty-head">
          <img src="/skrill/img/bounty.svg" alt="bounty" style="width:24px;height:24px">
          <span class="bounty-label">Bounty</span>
        </div>
        <div class="bounty-title">${currentWeek.bounty_title}</div>
        ${currentWeek.bounty_description ? `<div class="bounty-desc" style="margin-bottom:12px">${currentWeek.bounty_description}</div>` : ''}
        ${cards}
      </div>`;
  }

  function renderRatingPhase() {
    const goals = deliveredGoals();
    const bonusTotal = bonusPoolFor(allProfiles.length);
    const remaining = bonusTotal - myUsed;

    if (!goals.length) {
      // Auto-close immediately if nothing to rate
      const adminBtn = isAdmin() ? `<button class="btn btn-primary btn-sm" style="margin-top:14px" onclick="forceFinalize()">Forçar Encerramento</button>` : '';
      return `
        ${renderBountySection(false)}
        <div class="card" style="padding:36px 20px;text-align:center">
          <div style="font-size:30px;font-weight:700;margin-bottom:8px">Nenhuma entrega esta temporada</div>
          <div style="font-size:22px;color:var(--text-muted);text-transform:uppercase">Nada para avaliar.</div>
          ${adminBtn}
        </div>`;
    }

    if (mySubmitted) return `${renderBountySection(false)}${renderWaitingForOthers(goals)}`;

    const goalsHTML = goals.map(g => {
      const profile = g.profile;
      const cur = myRatings.get(g.id) ?? 0;
      const imgs = g.image_urls ?? [];
      const isMine = g.profile_id === stored.id;
      return `
        <div class="rating-card">
          <div class="rating-card-head">
            ${profile ? avatarHTML(profile) : ''}
            <div style="flex:1;min-width:0">
              <div style="font-size:22px;color:var(--text-muted);text-transform:uppercase">
                ${profile?.name ?? '?'} ${isMine ? '· você' : ''}
              </div>
              <div style="font-size:26px;font-weight:700">${g.title}</div>
              <div style="font-size:20px;color:var(--text-muted);margin-top:2px">
                ${difficultyChip(g.difficulty)} · base ${g.difficulty === 'complex' ? 5 : 2}pts
              </div>
            </div>
            <div class="rating-stepper">
              <button class="btn btn-sm btn-ghost" ${cur <= 0 ? 'disabled' : ''} onclick="decRating('${g.id}')">−</button>
              <div class="rating-value">${cur}</div>
              <button class="btn btn-sm btn-primary" ${remaining <= 0 ? 'disabled' : ''} onclick="incRating('${g.id}')">+</button>
            </div>
          </div>
          ${imgs.length ? `<div class="delivery-images">
            ${imgs.map(u => `<img class="reveal-img" src="${u}" alt="entrega">`).join('')}
          </div>` : ''}
        </div>`;
    }).join('');

    const canSubmit = myUsed === bonusTotal;
    return `
      ${renderBountySection(false)}
      <div class="card" style="margin-bottom:14px">
        <div class="card-header">
          <div class="card-title">Avaliação por pares</div>
          <div style="font-size:22px;font-weight:700">${myUsed} / ${bonusTotal} pts</div>
        </div>
        <div class="card-body" style="padding:14px">
          <div style="font-size:22px;color:var(--text-muted);text-transform:uppercase;margin-bottom:14px">
            Distribua seus ${bonusTotal} pontos bônus entre as entregas. Você pode dar para si mesmo.
            Distribuição anônima.
          </div>
          ${goalsHTML}
          <div style="text-align:center;margin-top:18px">
            <button id="rating-submit" class="btn btn-primary" style="font-size:26px;padding:12px 32px"
              ${canSubmit ? '' : 'disabled'} onclick="submitRatings()">
              Enviar avaliação
            </button>
            ${!canSubmit ? `<div style="font-size:20px;color:var(--text-muted);margin-top:8px;text-transform:uppercase">Distribua todos os ${bonusTotal} pontos para enviar</div>` : ''}
          </div>
        </div>
      </div>`;
  }

  function renderWaitingForOthers(goals) {
    const squares = allProfiles.map(p => `
      <div class="ready-square ${submissionIds.has(p.id) ? 'on' : ''}" title="${p.name}"></div>
    `).join('');
    const adminBtn = isAdmin() ? `
      <div style="margin-top:18px">
        <button class="btn btn-ghost btn-sm" onclick="forceFinalize()">Admin: forçar encerramento</button>
      </div>` : '';
    return `
      <div class="card">
        <div class="card-body" style="padding:24px;text-align:center">
          <div style="font-size:28px;font-weight:700;margin-bottom:12px;text-transform:uppercase">Avaliação enviada</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px">${squares}</div>
          <div style="font-size:24px;color:var(--text-muted);text-transform:uppercase">
            ${submissionIds.size} / ${allProfiles.length} avaliações recebidas
          </div>
          <div style="font-size:22px;color:var(--text-muted);margin-top:8px;text-transform:uppercase">Aguardando os demais...</div>
          ${adminBtn}
        </div>
      </div>`;
  }

  function renderReveal() {
    const completedGoals = deliveredGoals();
    const byMember = new Map();
    for (const p of allProfiles) byMember.set(p.id, { profile: p, goals: [] });
    for (const g of completedGoals) {
      if (byMember.has(g.profile_id)) byMember.get(g.profile_id).goals.push(g);
    }

    const blocks = [...byMember.values()].map(({ profile, goals: mGoals }) => {
      const totalPts = mGoals.reduce((s, g) => {
        const base = g.difficulty === 'complex' ? 5 : 2;
        const bonus = bonusByGoal.get(g.id) ?? 0;
        return s + base + bonus;
      }, 0);
      const goalsHTML = mGoals.map(g => {
        const imgs = g.image_urls ?? [];
        const base = g.difficulty === 'complex' ? 5 : 2;
        const bonus = bonusByGoal.get(g.id) ?? 0;
        return `
          <div style="margin-bottom:12px">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap">
              <span style="font-size:24px">${SVG_CHECK}</span>
              <span style="font-size:24px;font-weight:700">${g.title}</span>
              ${difficultyChip(g.difficulty)}
              <span style="margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap">
                <span class="badge" style="background:#D6EAF8;color:var(--blue);border-color:var(--blue)">base +${base}</span>
                ${bonus > 0 ? `<span class="badge" style="background:var(--amber-light);color:var(--amber-deep);border-color:var(--amber-dark)">bônus +${bonus}</span>` : ''}
                <span class="xp-earned">= ${base + bonus}pts</span>
              </span>
            </div>
            ${imgs.length ? `<div class="delivery-images">
              ${imgs.map(u => `<img class="reveal-img" src="${u}" alt="entrega">`).join('')}
            </div>` : ''}
          </div>`;
      }).join('');

      return `
        <div class="reveal-member-block" style="margin-bottom:16px">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)">
            ${avatarHTML(profile, 'avatar-md')}
            <div style="flex:1">
              <div style="font-size:28px;font-weight:700">${profile.name}</div>
              <div style="font-size:24px;color:var(--text-muted)">${mGoals.length} meta${mGoals.length !== 1 ? 's' : ''} entregue${mGoals.length !== 1 ? 's' : ''}</div>
            </div>
            <div style="font-size:32px;font-weight:700;color:var(--amber)">${totalPts}pts</div>
          </div>
          ${mGoals.length ? goalsHTML : `<div style="font-size:24px;color:var(--text-muted);text-align:center;padding:8px">Nenhuma meta entregue esta temporada</div>`}
        </div>`;
    }).join('');

    const grandTotal = completedGoals.reduce((s, g) => {
      const base = g.difficulty === 'complex' ? 5 : 2;
      return s + base + (bonusByGoal.get(g.id) ?? 0);
    }, 0);
    const nextNum  = currentWeek.week_number + 1;
    const nextYear = nextNum > 52 ? currentWeek.year + 1 : currentWeek.year;
    const nextDisp = nextNum > 52 ? 1 : nextNum;

    const canAdvance = canAdvanceSeason(currentWeek, participantIds, allProfilesFull);
    const advanceBtn = canAdvance ? `
      <div style="margin-top:20px;padding-top:20px;border-top:2px dashed var(--border);text-align:center">
        <div style="font-size:22px;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase">
          Temporada ${currentWeek.week_number} concluida
        </div>
        <div style="font-size:20px;color:var(--text-muted);margin-bottom:14px">
          Clique para encerrar esta temporada e abrir a Temporada ${nextDisp} · ${nextYear} para todos.
        </div>
        <button class="btn btn-primary" style="font-size:24px;padding:12px 32px" onclick="openAdvanceSeasonModal(currentWeek)">
          Encerrar e iniciar Temporada ${nextDisp}
        </button>
      </div>` : '';

    return `
      <div class="card">
        <div class="card-header">
          <div class="card-title">Resultados da Temporada</div>
          <div style="font-size:24px;font-weight:700;color:var(--amber)">${grandTotal}pts total</div>
        </div>
        <div class="card-body" style="padding:16px">${renderBountySection(true)}${blocks}</div>
      </div>
      ${advanceBtn}`;
  }

  // Tela para quem NÃO participou, quando a temporada já foi revelada/encerrada
  function renderClosedScreen(week, canAdvance) {
    const nextNum = week.week_number + 1 > 52 ? 1 : week.week_number + 1;
    const advance = canAdvance
      ? `<div style="margin-top:18px">
           <button class="btn btn-primary" style="font-size:24px;padding:12px 32px" onclick="openAdvanceSeasonModal(currentWeek)">
             Iniciar Temporada ${nextNum}
           </button>
         </div>`
      : `<div style="font-size:22px;color:var(--text-muted);margin-top:10px">Aguarde o início da próxima temporada.</div>`;
    return `
      <div style="width:100%">
        <div class="page-header">
          <div>
            <div class="page-header-label" style="display:flex;align-items:center;gap:8px"><img src="/skrill/img/Skrill_time.svg" alt="skrill-time" style="width:24px;height:24px"> Reuniao</div>
            <h1 class="page-header-title">Skrill Time</h1>
          </div>
        </div>
        <div class="card" style="text-align:center;padding:40px 20px">
          <div style="font-size:32px;font-weight:700;margin-bottom:6px">Temporada ${week.week_number} encerrada</div>
          <div style="font-size:24px;color:var(--text-muted)">Voce nao participou desta temporada.</div>
          ${advance}
        </div>
      </div>`;
  }

  async function markReady() {
    if (!currentWeek) return;
    const btn = document.querySelector('[onclick="markReady()"]');
    if (btn) { btn.disabled = true; btn.textContent = '...'; }

    const { error } = await sb.from('week_ready').insert({
      week_id:    currentWeek.id,
      profile_id: stored.id,
    });

    if (error && !error.message.includes('duplicate')) {
      if (btn) { btn.disabled = false; btn.textContent = 'Marcar Pronto'; }
      return;
    }

    readyIds.add(stored.id);

    const { count } = await sb.from('week_ready')
      .select('*', { count: 'exact', head: true })
      .eq('week_id', currentWeek.id);

    if (count >= allProfiles.length && allProfiles.length > 0) {
      await sb.from('weeks').update({ skrill_time_revealed: true }).eq('id', currentWeek.id);
      currentWeek = { ...currentWeek, skrill_time_revealed: true };
    }

    await reload();
  }

  async function unmarkReady() {
    if (!currentWeek) return;
    const btn = document.querySelector('[onclick="unmarkReady()"]');
    if (btn) { btn.disabled = true; btn.textContent = '...'; }

    await sb.from('week_ready')
      .delete()
      .eq('week_id', currentWeek.id)
      .eq('profile_id', stored.id);

    readyIds.delete(stored.id);
    renderPage();
  }

  async function incRating(goalId) {
    if (mySubmitted) return;
    const bonusTotal = bonusPoolFor(allProfiles.length);
    if (myUsed >= bonusTotal) return;
    const cur = (myRatings.get(goalId) ?? 0) + 1;
    myRatings.set(goalId, cur);
    myUsed++;
    await sb.from('peer_ratings').upsert(
      { week_id: currentWeek.id, rater_id: stored.id, goal_id: goalId, amount: cur },
      { onConflict: 'week_id,rater_id,goal_id' }
    );
    renderPage();
  }

  async function decRating(goalId) {
    if (mySubmitted) return;
    const cur = myRatings.get(goalId) ?? 0;
    if (cur <= 0) return;
    const next = cur - 1;
    myRatings.set(goalId, next);
    myUsed--;
    await sb.from('peer_ratings').upsert(
      { week_id: currentWeek.id, rater_id: stored.id, goal_id: goalId, amount: next },
      { onConflict: 'week_id,rater_id,goal_id' }
    );
    renderPage();
  }

  async function submitRatings() {
    if (mySubmitted) return;
    const bonusTotal = bonusPoolFor(allProfiles.length);
    if (myUsed !== bonusTotal) return;
    const btn = document.getElementById('rating-submit');
    if (btn) { btn.disabled = true; btn.textContent = '...'; }
    const { error } = await sb.from('peer_rating_submissions').insert({
      week_id: currentWeek.id, rater_id: stored.id,
    });
    if (error && !error.message.includes('duplicate')) {
      toast(error.message, '#ef4444');
      if (btn) { btn.disabled = false; btn.textContent = 'Enviar avaliação'; }
      return;
    }
    mySubmitted = true;
    submissionIds.add(stored.id);
    await checkAndAutoClose();
    await reload();
  }

  async function checkAndAutoClose() {
    if (!currentWeek || finalizing) return;
    const { data: subs } = await sb.from('peer_rating_submissions')
      .select('rater_id').eq('week_id', currentWeek.id);
    const sIds = new Set((subs ?? []).map(s => s.rater_id));
    const allDone = allProfiles.length > 0 && allProfiles.every(p => sIds.has(p.id));
    if (!allDone) return;
    const { data: anyAwarded } = await sb.from('goals')
      .select('id').eq('week_id', currentWeek.id).eq('points_awarded', true).limit(1);
    if (anyAwarded?.length) return;
    finalizing = true;
    try { await finalizeSeason(); }
    finally { finalizing = false; }
  }

  async function forceFinalize() {
    if (!confirm('Forçar encerramento agora? Os pontos serão concedidos imediatamente.')) return;
    finalizing = true;
    try {
      // Mark every participant as submitted so the season closes (reveal phase),
      // even if some never sent their peer rating.
      const missing = [...participantIds].filter(id => !submissionIds.has(id));
      if (missing.length) {
        await sb.from('peer_rating_submissions').insert(
          missing.map(id => ({ week_id: currentWeek.id, rater_id: id }))
        );
      }
      await finalizeSeason();
    } finally { finalizing = false; }
    await reload();
  }

  async function finalizeSeason() {
    await finalizeSeasonById(currentWeek.id);
  }

  init();
  initSkrillWalker();
  </script>
</body>
</html>

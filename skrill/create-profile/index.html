<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SKRILL — Criar Perfil</title>
  <link rel="icon" type="image/x-icon" href="/skrill/favicon.ico"/>
  <link rel="stylesheet" href="/skrill/css/style.css"/>
  <style>
    body { background: #ffffff; background-image: none; }
  </style>
</head>
<body>
  <div class="login-wrap" style="padding:32px 16px">
    <div class="login-box" style="max-width:560px">
      <div class="window">
        <div class="window-title" style="gap:8px">
          <img src="/skrill/img/Profile.svg" alt="profile" style="width:24px;height:24px"><span>Criar Perfil</span>
          <a href="/skrill/select-profile/" style="font-size:16px;color:var(--text-muted);text-decoration:none">← Voltar</a>
        </div>
        <div class="window-body" style="padding:24px 28px 28px">

          <form id="profile-form" onsubmit="handleSubmit(event)">

            <!-- Nome -->
            <div class="form-group">
              <label class="form-label">Nome / Apelido</label>
              <input id="profile-name" class="form-input" type="text" placeholder="Como te chamam?" required maxlength="30" autocomplete="off"/>
            </div>

            <!-- Canvas pixel art -->
            <div class="form-group">
              <label class="form-label">Foto de Perfil <span class="text-muted" style="font-size:14px">(preto e branco · 100×100px)</span></label>
              <div style="display:flex;flex-direction:column;align-items:center;gap:12px">

                <!-- Controles de cor e limpeza -->
                <div style="display:flex;gap:8px;align-items:center;width:100%;max-width:min(500px, calc(100vw - 64px))">
                  <button type="button" id="btn-black" onclick="selectColor(true)"
                    style="display:flex;align-items:center;gap:6px;padding:7px 16px;border:2px solid #000;cursor:pointer;font-family:'Micro 5',monospace;font-size:18px;font-weight:bold;text-transform:uppercase;background:#000;color:#fff;box-shadow:2px 2px 0 #555;">
                    Preto
                  </button>
                  <button type="button" id="btn-white" onclick="selectColor(false)"
                    style="display:flex;align-items:center;gap:6px;padding:7px 16px;border:2px solid #A0A0A0;cursor:pointer;font-family:'Micro 5',monospace;font-size:18px;font-weight:bold;text-transform:uppercase;background:#fff;color:#555;box-shadow:2px 2px 0 #A0A0A0;">
                    Branco
                  </button>
                  <button type="button" onclick="clearCanvas()"
                    style="margin-left:auto;padding:7px 14px;border:2px solid var(--border-dark);cursor:pointer;font-family:'Micro 5',monospace;font-size:18px;background:var(--surface);color:var(--text);box-shadow:2px 2px 0 var(--border-dark);text-transform:uppercase;">
                    Limpar
                  </button>
                </div>

                <div style="display:flex;align-items:flex-start;gap:10px">
                  <div class="pixel-canvas-wrap" style="flex:1;min-width:0">
                    <canvas id="pixel-canvas"></canvas>
                  </div>
                  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:2px">
                    <span style="font-family:'Micro 5',monospace;font-size:24px;color:var(--text-muted)">15</span>
                    <input type="range" id="brush-slider" min="2" max="15" value="2" step="1"
                      style="writing-mode:vertical-lr;direction:rtl;width:24px;height:140px;cursor:pointer;accent-color:#000;">
                    <span style="font-family:'Micro 5',monospace;font-size:24px;color:var(--text-muted)">2</span>
                    <div id="brush-label" style="font-family:'Micro 5',monospace;font-size:24px;font-weight:bold;margin-top:6px">2px</div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Senha -->
            <div class="form-group">
              <label class="form-label">Senha do Perfil</label>
              <input id="profile-password" class="form-input" type="password" placeholder="••••••••" required autocomplete="new-password"/>
            </div>

            <div id="error-msg" class="form-error hidden"></div>
            <button type="submit" id="submit-btn" class="btn btn-primary btn-full">Criar Perfil</button>
          </form>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/skrill/js/client.js"></script>
  <script>
  if (!isAppUnlocked()) {
    window.location.href = '/skrill/login/';
  }

  // ── Pixel art canvas ──────────────────────────────────────────────────────────
  const GRID_SIZE   = 100;
  const CELL_SIZE   = 5;
  const CANVAS_PX   = GRID_SIZE * CELL_SIZE; // 500
  let BRUSH_SIZE = 2;

  const canvas = document.getElementById('pixel-canvas');
  const ctx    = canvas.getContext('2d');
  canvas.width  = CANVAS_PX;
  canvas.height = CANVAS_PX;

  const pixels = new Array(GRID_SIZE * GRID_SIZE).fill(false); // false=branco, true=preto

  let isPainting = false;
  let paintValue = true; // preto por padrão

  function selectColor(black) {
    paintValue = black;
    const btnBlack = document.getElementById('btn-black');
    const btnWhite = document.getElementById('btn-white');
    if (black) {
      btnBlack.style.background = '#000';
      btnBlack.style.color      = '#fff';
      btnBlack.style.borderColor = '#000';
      btnBlack.style.boxShadow  = '2px 2px 0 #555';
      btnWhite.style.background = '#fff';
      btnWhite.style.color      = '#888';
      btnWhite.style.borderColor = '#A0A0A0';
      btnWhite.style.boxShadow  = '2px 2px 0 #A0A0A0';
    } else {
      btnWhite.style.background = '#fff';
      btnWhite.style.color      = '#000';
      btnWhite.style.borderColor = '#000';
      btnWhite.style.boxShadow  = '2px 2px 0 #555';
      btnBlack.style.background = '#eee';
      btnBlack.style.color      = '#888';
      btnBlack.style.borderColor = '#A0A0A0';
      btnBlack.style.boxShadow  = '2px 2px 0 #A0A0A0';
    }
  }

  function renderCanvas() {
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, CANVAS_PX, CANVAS_PX);
    for (let y = 0; y < GRID_SIZE; y++) {
      for (let x = 0; x < GRID_SIZE; x++) {
        if (pixels[y * GRID_SIZE + x]) {
          ctx.fillStyle = '#000000';
          ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
        }
      }
    }
    ctx.strokeStyle = 'rgba(180,180,180,0.35)';
    ctx.lineWidth = 0.5;
    for (let x = 0; x <= GRID_SIZE; x++) {
      ctx.beginPath(); ctx.moveTo(x * CELL_SIZE, 0); ctx.lineTo(x * CELL_SIZE, CANVAS_PX); ctx.stroke();
    }
    for (let y = 0; y <= GRID_SIZE; y++) {
      ctx.beginPath(); ctx.moveTo(0, y * CELL_SIZE); ctx.lineTo(CANVAS_PX, y * CELL_SIZE); ctx.stroke();
    }
  }

  function getPixelCoords(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = CANVAS_PX / rect.width;
    const scaleY = CANVAS_PX / rect.height;
    return {
      x: Math.floor((clientX - rect.left) * scaleX / CELL_SIZE),
      y: Math.floor((clientY - rect.top)  * scaleY / CELL_SIZE),
    };
  }

  function paintAt(clientX, clientY) {
    const { x, y } = getPixelCoords(clientX, clientY);
    const half = Math.floor(BRUSH_SIZE / 2);
    for (let dy = -half; dy < BRUSH_SIZE - half; dy++) {
      for (let dx = -half; dx < BRUSH_SIZE - half; dx++) {
        const px = x + dx;
        const py = y + dy;
        if (px < 0 || px >= GRID_SIZE || py < 0 || py >= GRID_SIZE) continue;
        pixels[py * GRID_SIZE + px] = paintValue;
        ctx.fillStyle = paintValue ? '#000000' : '#FFFFFF';
        ctx.fillRect(px * CELL_SIZE, py * CELL_SIZE, CELL_SIZE, CELL_SIZE);
      }
    }
  }

  canvas.addEventListener('mousedown', e => {
    isPainting = true;
    paintAt(e.clientX, e.clientY);
  });
  canvas.addEventListener('mousemove', e => { if (isPainting) paintAt(e.clientX, e.clientY); });
  canvas.addEventListener('mouseup',    () => { isPainting = false; });
  canvas.addEventListener('mouseleave', () => { isPainting = false; });

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    isPainting = true;
    paintAt(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (isPainting) paintAt(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });
  canvas.addEventListener('touchend', e => { e.preventDefault(); isPainting = false; }, { passive: false });

  function clearCanvas() {
    pixels.fill(false);
    renderCanvas();
  }

  function getAvatarDataURL() {
    const off  = document.createElement('canvas');
    off.width  = GRID_SIZE;
    off.height = GRID_SIZE;
    const octx = off.getContext('2d');
    octx.fillStyle = '#FFFFFF';
    octx.fillRect(0, 0, GRID_SIZE, GRID_SIZE);
    for (let y = 0; y < GRID_SIZE; y++) {
      for (let x = 0; x < GRID_SIZE; x++) {
        if (pixels[y * GRID_SIZE + x]) {
          octx.fillStyle = '#000000';
          octx.fillRect(x, y, 1, 1);
        }
      }
    }
    return off.toDataURL('image/png');
  }

  // Inicializa
  renderCanvas();
  selectColor(true);

  const brushSlider = document.getElementById('brush-slider');
  const brushLabel  = document.getElementById('brush-label');
  brushSlider.addEventListener('input', () => {
    BRUSH_SIZE = parseInt(brushSlider.value);
    brushLabel.textContent = BRUSH_SIZE + 'px';
  });

  // ── Form submission ───────────────────────────────────────────────────────────
  async function handleSubmit(e) {
    e.preventDefault();
    const name     = document.getElementById('profile-name').value.trim();
    const password = document.getElementById('profile-password').value;
    const btn      = document.getElementById('submit-btn');
    const errEl    = document.getElementById('error-msg');
    errEl.classList.add('hidden');

    if (!name || !password) {
      errEl.textContent = 'Preencha nome e senha.';
      errEl.classList.remove('hidden');
      return;
    }

    btn.disabled = true;
    btn.textContent = '...';

    const avatar = getAvatarDataURL();

    const { data, error } = await sb
      .from('profiles')
      .insert({ name, password, avatar_data: avatar })
      .select('*')
      .single();

    if (error) {
      errEl.textContent = error.message;
      errEl.classList.remove('hidden');
      btn.disabled = false;
      btn.textContent = 'Criar Perfil';
      return;
    }

    setStoredProfile(data);
    window.location.href = '/skrill/dashboard/';
  }
  </script>
</body>
</html>

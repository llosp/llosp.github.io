<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SKRILL — Leaderboard</title>
  <link rel="icon" type="image/x-icon" href="/skrill/favicon.ico"/>
  <link rel="stylesheet" href="/skrill/css/style.css"/>
</head>
<body>
  <div class="orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
  <div class="app-layout">
    <div id="sidebar-root"></div>
    <main class="main-content">
      <div class="page-inner">
        <div id="app" class="center-screen"><div class="spinner"></div></div>
      </div>
    </main>
    <div id="mobile-nav-root"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/skrill/js/client.js"></script>
  <script>
  if (!isAppUnlocked()) { window.location.href = '/skrill/login/'; }
  else if (!getStoredProfile()) { window.location.href = '/skrill/select-profile/'; }

  let currentId = null;
  let monthly = [];
  let allTime = [];

  async function init() {
    const stored = requireAuth();
    if (!stored) return;
    currentId = stored.id;

    const cutoff = new Date(Date.now() - 30 * 86400000).toISOString();
    const [{ data: profile }, { data: profiles }, { data: history }] = await Promise.all([
      sb.from('profiles').select('*').eq('id', stored.id).single(),
      sb.from('profiles').select('*'),
      sb.from('point_history').select('profile_id,amount,created_at').gte('created_at', cutoff),
    ]);

    if (profile) setStoredProfile(profile);

    document.getElementById('sidebar-root').innerHTML = renderSidebar(profile, 'leaderboard');
    document.getElementById('mobile-nav-root').innerHTML = renderMobileNav('leaderboard');

    const monthlyMap = new Map();
    for (const h of (history ?? [])) {
      monthlyMap.set(h.profile_id, (monthlyMap.get(h.profile_id) ?? 0) + (h.amount ?? 0));
    }
    const profs = profiles ?? [];
    monthly = profs.map(p => ({ ...p, period_points: monthlyMap.get(p.id) ?? 0 }))
                   .sort((a, b) => (b.period_points - a.period_points) || a.name.localeCompare(b.name));
    allTime = [...profs].sort((a, b) => ((b.total_points ?? 0) - (a.total_points ?? 0)) || a.name.localeCompare(b.name));

    const my30 = monthly.findIndex(p => p.id === currentId) + 1;
    const myAll = allTime.findIndex(p => p.id === currentId) + 1;

    const app = document.getElementById('app');
    app.classList.remove('center-screen');
    app.innerHTML = `
      <div style="width:100%">
        <div class="page-header">
          <div>
            <div class="page-header-label" style="display:flex;align-items:center;gap:8px"><img src="/skrill/img/leaderboard.svg" alt="leaderboard" style="width:24px;height:24px"> Rankings</div>
            <h1 class="page-header-title">Leaderboard</h1>
          </div>
          <div style="text-align:right">
            <div class="text-muted text-sm">${profs.length} membros</div>
            <div style="font-size:22px;font-weight:700;color:var(--amber);margin-top:4px">
              30d: #${my30 || '—'} · All-Time: #${myAll || '—'}
            </div>
          </div>
        </div>

        <div class="tab-list">
          <button class="tab-btn active" data-tab="tab-30d" onclick="switchTab('tab-30d')">30 Dias</button>
          <button class="tab-btn" data-tab="tab-all" onclick="switchTab('tab-all')">All-Time</button>
        </div>

        <div id="tab-30d" class="tab-panel active">
          ${renderRanking(monthly, 'period_points')}
        </div>
        <div id="tab-all" class="tab-panel">
          ${renderRanking(allTime, 'total_points')}
        </div>
      </div>`;
  }

  function renderRanking(entries, field) {
    if (!entries.length) {
      return `<div class="empty-state"><div class="empty-icon"><img src="/skrill/img/leaderboard.svg" alt="leaderboard" style="width:48px;height:48px"></div><h3>Nenhum membro ainda</h3></div>`;
    }
    return renderPodium(entries, field) + renderList(entries.slice(3), field, 4);
  }

  function renderPodium(entries, field) {
    const [first, second, third] = entries;
    function col(p, cls, medal) {
      if (!p) {
        return `<div class="podium-col ${cls} empty">
          <div class="podium-medal">${medal}</div>
          <div class="avatar avatar-md" style="opacity:.3">—</div>
          <div class="podium-name" style="color:var(--text-light)">vazio</div>
          <div class="podium-xp">0pts</div>
          <div class="podium-block"><div class="podium-block-num">${medal}</div></div>
        </div>`;
      }
      const me = p.id === currentId ? 'me' : '';
      return `<a href="/skrill/profile/?id=${p.id}" class="podium-col ${cls} ${me}" style="text-decoration:none;color:inherit">
        <div class="podium-medal">${medal}</div>
        ${avatarHTML(p, cls === 'p1' ? 'avatar-lg' : 'avatar-md')}
        <div class="podium-name">${p.name}</div>
        <div class="podium-xp">${(p[field] ?? 0).toLocaleString()}pts</div>
        <div class="podium-block"><div class="podium-block-num">${medal}</div></div>
      </a>`;
    }
    return `
      <div class="podium-wrap">
        <div class="podium">
          ${col(second, 'p2', '#2')}
          ${col(first,  'p1', '#1')}
          ${col(third,  'p3', '#3')}
        </div>
      </div>`;
  }

  function renderList(entries, field, startRank) {
    if (!entries.length) return '';
    return `
      <div style="font-size:22px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin:18px 0 8px">
        Classificação Completa
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${entries.map((p, i) => `
          <a href="/skrill/profile/?id=${p.id}" class="lb-entry ${p.id===currentId?'me':''}">
            <div class="rank-num">#${i + startRank}</div>
            ${avatarHTML(p)}
            <div class="entry-info">
              <div class="entry-name-main">${p.name}</div>
              <div class="entry-name-sub">${p.streak_current ?? 0}<img src="/skrill/img/streak.svg" alt="streak" style="width:16px;height:16px;vertical-align:middle;position:relative;top:-2px;margin-left:3px"></div>
            </div>
            <div class="entry-xp">${(p[field] ?? 0).toLocaleString()}pts</div>
          </a>`).join('')}
      </div>`;
  }

  init();
  initSkrillWalker();
  </script>
</body>
</html>

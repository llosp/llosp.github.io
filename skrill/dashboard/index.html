<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SKRILL — Dashboard</title>
  <link rel="icon" type="image/x-icon" href="/skrill/favicon.ico"/>
  <link rel="stylesheet" href="/skrill/css/style.css"/>
</head>
<body>
  <div class="orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
  <div class="app-layout">
    <div id="sidebar-root"></div>
    <main class="main-content">
      <div class="page-inner">
        <div id="app" class="center-screen"><div class="spinner"></div></div>
      </div>
    </main>
    <div id="mobile-nav-root"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/skrill/js/client.js"></script>
  <script>
  if (!isAppUnlocked()) { window.location.href = '/skrill/login/'; }
  else if (!getStoredProfile()) { window.location.href = '/skrill/select-profile/'; }

  let currentWeek     = null;
  let currentProfile  = null;
  let currentStored   = null;
  let isParticipating = false;
  let canAdvance      = false;

  async function init() {
    currentStored = requireAuth();
    if (!currentStored) return;

    let profile, week, allProfiles, meeting, history;
    const lbCutoff = new Date(Date.now() - 30 * 86400000).toISOString();
    try {
      ([
        { data: profile },
        { data: week },
        { data: allProfiles },
        { data: meeting },
        { data: history },
      ] = await Promise.all([
        sb.from('profiles').select('*').eq('id', currentStored.id).single(),
        sb.from('weeks').select('*').eq('is_current', true).maybeSingle(),
        sb.from('profiles').select('*'),
        sb.from('meetings').select('*').order('scheduled_at', { ascending: false }).limit(1).maybeSingle(),
        sb.from('point_history').select('profile_id,amount').gte('created_at', lbCutoff),
      ]));
    } catch (e) {
      document.getElementById('app').innerHTML = `<div class="card" style="padding:32px;text-align:center;border-color:#ef4444">
        <div style="font-size:26px;font-weight:700;color:#ef4444;margin-bottom:8px">Erro ao carregar dashboard</div>
        <div style="font-size:22px;color:var(--text-muted)">${e?.message ?? 'Erro desconhecido. Verifique a conexão.'}</div>
        <button class="btn btn-primary" style="margin-top:16px" onclick="location.reload()">Tentar novamente</button>
      </div>`;
      return;
    }

    if (profile) setStoredProfile(profile);
    currentProfile = profile;
    currentWeek    = week;

    const lbMap = new Map();
    for (const h of (history ?? [])) {
      lbMap.set(h.profile_id, (lbMap.get(h.profile_id) ?? 0) + (h.amount ?? 0));
    }
    const miniRanked = (allProfiles ?? [])
      .map(p => ({ ...p, period_points: lbMap.get(p.id) ?? 0 }))
      .sort((a, b) => (b.period_points - a.period_points) || a.name.localeCompare(b.name));

    document.getElementById('sidebar-root').innerHTML  = renderSidebar(profile, 'dashboard');
    document.getElementById('mobile-nav-root').innerHTML = renderMobileNav('dashboard');

    if (!week) {
      document.getElementById('app').innerHTML = renderNoWeekBanner();
      return;
    }

    // Participation status + goals for current week
    const [{ data: participation }, { data: goalsData }, { data: allParticipants }] = await Promise.all([
      sb.from('season_participants').select('id').eq('week_id', week.id).eq('profile_id', currentStored.id).maybeSingle(),
      sb.from('goals').select('*, profile:profiles(*)')
        .eq('week_id', week.id)
        .order('completed_at', { ascending: false, nullsFirst: false }),
      sb.from('season_participants').select('profile_id').eq('week_id', week.id),
    ]).catch(() => [{ data: null }, { data: [] }, { data: [] }]);

    isParticipating = !!participation;
    const participantIds = new Set((allParticipants ?? []).map(p => p.profile_id));
    canAdvance = canAdvanceSeason(week, participantIds, allProfiles ?? []);
    const goals      = goalsData ?? [];
    const myGoals    = goals.filter(g => g.profile_id === currentStored.id);
    const done       = myGoals.filter(g => g.status === 'completed' || g.status === 'beyond');
    const revealed   = week?.skrill_time_revealed ?? false;
    const deliveries = goals.filter(g => (g.status === 'completed' || g.status === 'beyond') && (g.image_urls?.length > 0));

    document.getElementById('app').innerHTML = `
      <div style="width:100%">
        <div class="page-header">
          <div>
            <div class="page-header-label">Bem-vindo de volta,</div>
            <h1 class="page-header-title">${profile?.name ?? 'Guild Member'}</h1>
            ${week ? `<div style="font-size:24px;color:var(--text-muted);margin-top:6px;text-transform:uppercase;">
              Temporada ${week.week_number} · ${week.year}
              &nbsp;·&nbsp; <img src="/skrill/img/streak.svg" alt="streak" style="width:20px;height:20px;vertical-align:middle;position:relative;top:-2px;margin-right:2px">${profile?.streak_current ?? 0}w
            </div>` : ''}
          </div>
        </div>

        <div id="participation-card" style="margin-bottom:16px">
          ${renderParticipationCard()}
        </div>

        <div class="stats-grid-2">
          <div class="stat-card stat-card-row">
            <div class="stat-icon amber"><img src="/skrill/img/points.svg" alt="points" style="width:22px;height:22px"></div>
            <div class="stat-card-info">
              <div class="stat-value">${(profile?.total_points ?? 0).toLocaleString()}</div>
              <div class="stat-label">Total Pts</div>
            </div>
          </div>
          <div class="stat-card stat-card-row">
            <div class="stat-icon green"><img src="/skrill/img/goals.svg" alt="goals" style="width:26px;height:26px"></div>
            <div class="stat-card-info">
              <div class="stat-value">${done.length}/${myGoals.length}</div>
              <div class="stat-label">Metas Feitas</div>
            </div>
          </div>
        </div>

        <div class="main-grid">
          <div class="col-left">
            ${renderWeeklyProgress(myGoals)}
            ${renderDeliveryFeed(deliveries, revealed)}
          </div>
          <div class="col-right">
            ${renderMiniLeaderboard(miniRanked, currentStored.id)}
            ${renderNextMeeting(meeting)}
          </div>
        </div>
      </div>`;
  }

  function renderParticipationCard() {
    if (!currentWeek) return '';
    return `
      <div class="card" style="background:var(--amber-light);border-color:var(--amber);">
        <div class="card-body" style="padding:16px;display:flex;align-items:center;gap:14px">
          <div style="flex:1;min-width:0">
            <div style="font-size:26px;font-weight:700">Temporada ${currentWeek.week_number} · ${currentWeek.year}</div>
            <div style="font-size:20px;color:var(--text-muted);text-transform:uppercase">
              ${isParticipating ? `${SVG_CHECK} Voce esta participando` : `${SVG_EMPTY} Voce nao esta participando`}
            </div>
          </div>
          ${currentWeek?.skrill_time_revealed
            ? (canAdvance
                ? `<button class="btn btn-primary btn-sm" style="font-size:22px;padding:10px 20px" onclick="openAdvanceSeasonModal(currentWeek)">Iniciar próxima Temporada</button>`
                : `<span style="font-size:20px;color:var(--text-muted);text-transform:uppercase;text-align:right">Temporada revelada<br>aguarde a proxima</span>`)
            : isParticipating
              ? `<button class="btn btn-ghost btn-sm" style="font-size:20px;opacity:0.6" onclick="leaveSeason()">Sair</button>`
              : `<button class="btn btn-primary btn-sm" style="font-size:22px;padding:10px 20px" onclick="joinSeason()">Participar</button>`
          }
        </div>
      </div>`;
  }

  async function joinSeason() {
    if (currentWeek?.skrill_time_revealed) {
      toast('Temporada já revelada. Aguarde a próxima para entrar.', '#ef4444');
      return;
    }
    const btn = document.querySelector('[onclick="joinSeason()"]');
    if (btn) { btn.disabled = true; btn.textContent = '...'; }
    await sb.from('season_participants').insert({ week_id: currentWeek.id, profile_id: currentProfile.id });
    isParticipating = true;
    const card = document.getElementById('participation-card');
    if (card) card.innerHTML = renderParticipationCard();
  }

  async function leaveSeason() {
    if (!confirm('Sair desta temporada?')) return;
    const btn = document.querySelector('[onclick="leaveSeason()"]');
    if (btn) { btn.disabled = true; btn.textContent = '...'; }
    await sb.from('season_participants').delete().eq('week_id', currentWeek.id).eq('profile_id', currentProfile.id);
    isParticipating = false;
    const card = document.getElementById('participation-card');
    if (card) card.innerHTML = renderParticipationCard();
  }

  function renderWeeklyProgress(goals) {
    if (!goals.length) return `
      <div class="card">
        <div class="card-header"><div class="card-title">>> Progresso da Temporada</div></div>
        <div class="card-body">
          <div class="empty-state"><div class="empty-icon"><img src="/skrill/img/goals.svg" alt="goals" style="width:48px;height:48px"></div><p>Nenhuma meta ainda esta temporada</p></div>
        </div>
      </div>`;
    const rows = goals.slice(0, 8).map(g => `
      <div class="goal-row">
        <span>${g.status === 'completed' || g.status === 'beyond' ? SVG_CHECK : SVG_EMPTY}</span>
        <div class="goal-row-title">${g.title}</div>
        ${statusBadge(g.status, g.points_earned)}
      </div>`).join('');
    return `
      <div class="card">
        <div class="card-header">
          <div class="card-title">>> Progresso da Temporada</div>
          <a href="/skrill/weekly/" class="card-link">Ver tudo →</a>
        </div>
        <div class="card-body"><div class="goal-rows">${rows}</div></div>
      </div>`;
  }

  function renderDeliveryFeed(deliveries, revealed) {
    const title = 'Entregas da Temporada';
    if (!deliveries.length) return `
      <div class="card">
        <div class="card-header"><div class="card-title">${title}</div></div>
        <div class="card-body"><div class="empty-state"><p>Nenhuma entrega ainda esta temporada</p></div></div>
      </div>`;

    const posts = deliveries.slice(0, 10).map(g => {
      const p = g.profile;
      const imgs = (g.image_urls ?? []);
      return `
        <div class="delivery-post">
          <div class="delivery-post-header">
            ${p ? avatarHTML(p) : ''}
            <div>
              <div class="delivery-post-caption">
                <strong>${p?.name ?? '?'}</strong>
                <span class="text-muted"> entregou </span>
                <strong>${g.title}</strong>
              </div>
              <div class="delivery-post-time">${g.completed_at ? timeAgo(g.completed_at) : ''}</div>
            </div>
          </div>
          ${imgs.length ? `<div class="delivery-images">
            ${imgs.map(u => `<img class="delivery-img${revealed ? '' : ' blurred'}" src="${u}" alt="entrega">`).join('')}
          </div>` : ''}
        </div>`;
    }).join('');

    const blurNote = !revealed
      ? `<div style="font-size:24px;color:var(--text-muted);text-align:center;padding:6px;text-transform:uppercase;border-top:1px solid var(--border)">
           Imagens reveladas no Skrill Time
         </div>` : '';

    return `
      <div class="card">
        <div class="card-header">
          <div class="card-title">${title}</div>
          <a href="/skrill/weekly/" class="card-link">Ver tudo →</a>
        </div>
        <div class="card-body" style="padding:12px">${posts}</div>
        ${blurNote}
      </div>`;
  }

  function renderMiniLeaderboard(profiles, currentId) {
    if (!profiles.length) return `
      <div class="card">
        <div class="card-header"><div class="card-title" style="gap:8px"><img src="/skrill/img/leaderboard.svg" alt="leaderboard" style="width:24px;height:24px"> Top Guild</div></div>
        <div class="card-body"><div class="empty-state"><p>Nenhum membro ainda</p></div></div>
      </div>`;
    const items = profiles.slice(0, 5).map((p, i) => `
      <a href="/skrill/profile/?id=${p.id}" class="lb-entry ${i===0?'r1':i===1?'r2':i===2?'r3':''} ${p.id===currentId?'me':''}">
        <div class="rank-num">${i===0?'#1':i===1?'#2':i===2?'#3':'#'+(i+1)}</div>
        ${avatarHTML(p)}
        <div class="entry-info"><div class="entry-name-main">${p.name}</div></div>
        <div class="entry-xp">${p.period_points ?? 0}pts</div>
      </a>`).join('');
    return `
      <div class="card">
        <div class="card-header" style="gap: 20px;">
          <div class="card-title" style="gap:8px"><img src="/skrill/img/leaderboard.svg" alt="leaderboard" style="width:24px;height:24px"> Top 30 Dias</div>
          <a href="/skrill/leaderboard/" class="card-link">→</a>
        </div>
        <div class="card-body" style="padding:8px 12px">${items}</div>
      </div>`;
  }

  function renderNextMeeting(meeting) {
    if (!meeting) return `
      <div class="meeting-card">
        <div class="meeting-lbl">Skrill Time</div>
        <a href="/skrill/skrill-time/" class="btn btn-primary btn-full" style="margin-top:10px">Ir para Skrill Time →</a>
      </div>`;
    const d = new Date(meeting.scheduled_at);
    return `
      <div class="meeting-card">
        <div class="meeting-lbl">Próxima Reunião</div>
        <div class="meeting-date">${d.toLocaleDateString('pt-BR', { weekday: 'short', month: 'short', day: 'numeric' })}</div>
        <div class="meeting-time">${d.toLocaleTimeString('pt-BR', { hour: 'numeric', minute: '2-digit' })}</div>
        ${meeting.discord_link ? `<a href="${meeting.discord_link}" target="_blank" class="btn btn-sm btn-purple-soft" style="margin-top:10px">Entrar Discord →</a>` : ''}
        <a href="/skrill/skrill-time/" class="btn btn-primary btn-full" style="margin-top:8px">Ir para Skrill Time →</a>
      </div>`;
  }


  init();
  initSkrillWalker();
  </script>
</body>
</html>

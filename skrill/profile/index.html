<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SKRILL — Perfil</title>
  <link rel="icon" type="image/x-icon" href="/skrill/favicon.ico"/>
  <link rel="stylesheet" href="/skrill/css/style.css"/>
</head>
<body>
  <div class="orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
  <div class="app-layout">
    <div id="sidebar-root"></div>
    <main class="main-content">
      <div class="page-inner">
        <div id="app" class="center-screen"><div class="spinner"></div></div>
      </div>
    </main>
    <div id="mobile-nav-root"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/skrill/js/client.js"></script>
  <script>
  async function init() {
    const stored = requireAuth();
    if (!stored) return;

    const targetId = new URLSearchParams(location.search).get('id') || stored.id;

    const [
      { data: me },
      { data: profile },
      { data: goals },
      { data: history },
    ] = await Promise.all([
      sb.from('profiles').select('*').eq('id', stored.id).single(),
      sb.from('profiles').select('*').eq('id', targetId).single(),
      sb.from('goals').select('*').eq('profile_id', targetId).order('created_at', { ascending: false }),
      sb.from('point_history').select('*').eq('profile_id', targetId).order('created_at', { ascending: false }).limit(50),
    ]);

    if (me) setStoredProfile(me);

    document.getElementById('sidebar-root').innerHTML = renderSidebar(me, 'profile');
    document.getElementById('mobile-nav-root').innerHTML = renderMobileNav('profile');

    if (!profile) {
      document.getElementById('app').innerHTML = `<div class="empty-state"><h3>Membro não encontrado</h3></div>`;
      return;
    }

    const isMe = profile.id === stored.id;
    const completedGoals = (goals ?? []).filter(g => g.status === 'completed' || g.status === 'beyond');

    document.getElementById('app').innerHTML = `
      <div style="width:100%">
        <!-- Hero -->
        <div class="profile-hero">
          ${avatarHTML(profile, 'avatar-xl')}
          <div class="profile-hero-info">
            <div class="profile-display">${profile.name}</div>
            <div class="profile-stats-row">
              <div class="profile-stat">
                <div class="profile-stat-val">${(profile.total_points ?? 0).toLocaleString()}</div>
                <div class="profile-stat-lbl">Total Pts</div>
              </div>
              <div class="profile-stat">
                <div class="profile-stat-val">${profile.weekly_points ?? 0}</div>
                <div class="profile-stat-lbl">Pts Semana</div>
              </div>
              <div class="profile-stat">
                <div class="profile-stat-val">${completedGoals.length}</div>
                <div class="profile-stat-lbl">Metas Feitas</div>
              </div>
              <div class="profile-stat">
                <div class="profile-stat-val">${profile.streak_current ?? 0}w</div>
                <div class="profile-stat-lbl">Streak</div>
              </div>
              <div class="profile-stat">
                <div class="profile-stat-val">${profile.streak_longest ?? 0}w</div>
                <div class="profile-stat-lbl">Melhor</div>
              </div>
            </div>
          </div>
          ${isMe ? `<button class="btn btn-sm btn-ghost" onclick="signOut()">← Trocar perfil</button>` : ''}
        </div>

        <!-- Tabs -->
        <div class="tab-list">
          <button class="tab-btn active" data-tab="tab-goals" onclick="switchTab('tab-goals')">
            🎯 Metas <span class="tab-count">${(goals ?? []).length}</span>
          </button>
          <button class="tab-btn" data-tab="tab-activity" onclick="switchTab('tab-activity')">
            ⚡ Atividade
          </button>
        </div>

        <div id="tab-goals" class="tab-panel active">
          ${renderGoalList(goals ?? [])}
        </div>
        <div id="tab-activity" class="tab-panel">
          ${renderActivityLog(history ?? [])}
        </div>
      </div>`;
  }

  function renderGoalList(goals) {
    if (!goals.length) return `<div class="empty-state"><div class="empty-icon">🎯</div><h3>Nenhuma meta ainda</h3></div>`;
    return goals.map(g => `
      <div class="goal-card ${g.status === 'beyond' ? 'beyond' : g.status === 'completed' ? 'completed' : ''}">
        <div class="goal-card-top">
          <div class="goal-card-meta">
            <div class="goal-user-row"><span class="goal-time">${formatDate(g.created_at)}</span></div>
            <div class="goal-title ${g.status === 'completed' || g.status === 'beyond' ? 'done' : ''}">${g.title}</div>
            ${g.description ? `<div class="goal-desc">${g.description}</div>` : ''}
          </div>
        </div>
        <div class="goal-footer">${statusBadge(g.status, g.points_earned)}</div>
      </div>`).join('');
  }

  function renderActivityLog(history) {
    if (!history.length) return `<div class="empty-state"><p>Nenhuma atividade ainda</p></div>`;
    return `<div class="card"><div class="card-body" style="max-height:400px;overflow-y:auto">
      ${history.map(h => `
        <div class="xp-row">
          <div>
            <div class="xp-reason">${h.reason.replace(/_/g, ' ')}</div>
            <div class="xp-date">${formatDate(h.created_at)}</div>
          </div>
          <div class="xp-amount">+${h.amount}pts</div>
        </div>`).join('')}
    </div></div>`;
  }

  init();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SKRILL — Skrill Time</title>
  <link rel="icon" type="image/x-icon" href="/skrill/favicon.ico"/>
  <link rel="stylesheet" href="/skrill/css/style.css"/>
</head>
<body>
  <div class="orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
  <div class="app-layout">
    <div id="sidebar-root"></div>
    <main class="main-content">
      <div class="page-inner">
        <div id="app" class="center-screen"><div class="spinner"></div></div>
      </div>
    </main>
    <div id="mobile-nav-root"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/skrill/js/client.js"></script>
  <script>
  if (!isAppUnlocked()) { window.location.href = '/skrill/login/'; }
  else if (!getStoredProfile()) { window.location.href = '/skrill/select-profile/'; }

  let stored            = null;
  let currentWeek       = null;
  let allProfiles       = [];
  let allProfilesFull   = [];
  let participantIds    = new Set();
  let readyIds          = new Set();
  let weekGoals         = [];
  let realtimeCh        = null;
  let countdownInterval = null;

  async function init() {
    stored = requireAuth();
    if (!stored) return;

    const [{ data: me }, { data: week }, { data: profiles }] = await Promise.all([
      sb.from('profiles').select('*').eq('id', stored.id).single(),
      sb.from('weeks').select('*').eq('is_current', true).single(),
      sb.from('profiles').select('*').order('name'),
    ]);

    if (me) setStoredProfile(me);
    stored = me ?? stored;

    document.getElementById('sidebar-root').innerHTML = renderSidebar(me, 'skrill-time');
    document.getElementById('mobile-nav-root').innerHTML = renderMobileNav('skrill-time');

    currentWeek     = week;
    allProfilesFull = profiles ?? [];

    if (week) {
      const [{ data: ready }, { data: goals }, { data: participants }] = await Promise.all([
        sb.from('week_ready').select('*').eq('week_id', week.id),
        sb.from('goals').select('*, profile:profiles(*)').eq('week_id', week.id),
        sb.from('season_participants').select('profile_id').eq('week_id', week.id),
      ]);
      readyIds       = new Set((ready ?? []).map(r => r.profile_id));
      weekGoals      = goals ?? [];
      participantIds = new Set((participants ?? []).map(p => p.profile_id));
      allProfiles    = allProfilesFull.filter(p => participantIds.has(p.id));
    }

    renderPage();
    subscribeRealtime();
  }

  function subscribeRealtime() {
    if (realtimeCh) realtimeCh.unsubscribe();
    realtimeCh = sb.channel('skrill-time-ch')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'week_ready' }, () => reload())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'season_participants' }, () => reload())
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'weeks' }, payload => {
        if (payload.new?.id === currentWeek?.id) {
          currentWeek = { ...currentWeek, ...payload.new };
          renderPage();
        }
      })
      .subscribe();
  }

  async function reload() {
    if (!currentWeek) return;
    const [{ data: ready }, { data: goals }, { data: participants }] = await Promise.all([
      sb.from('week_ready').select('*').eq('week_id', currentWeek.id),
      sb.from('goals').select('*, profile:profiles(*)').eq('week_id', currentWeek.id),
      sb.from('season_participants').select('profile_id').eq('week_id', currentWeek.id),
    ]);
    const { data: week } = await sb.from('weeks').select('*').eq('id', currentWeek.id).single();
    if (week) currentWeek = week;
    readyIds       = new Set((ready ?? []).map(r => r.profile_id));
    weekGoals      = goals ?? [];
    participantIds = new Set((participants ?? []).map(p => p.profile_id));
    allProfiles    = allProfilesFull.filter(p => participantIds.has(p.id));
    renderPage();
  }

  function isSkrillDay() {
    if (!currentWeek?.end_date) return true;
    const t = new Date();
    const todayStr = t.getFullYear() + '-' +
      String(t.getMonth() + 1).padStart(2, '0') + '-' +
      String(t.getDate()).padStart(2, '0');
    return todayStr >= currentWeek.end_date;
  }

  function renderPage() {
    if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }

    const week = currentWeek;

    if (!week) {
      document.getElementById('app').innerHTML = `<div style="width:100%">
        <div class="page-header">
          <div>
            <div class="page-header-label">[S] Reuniao</div>
            <h1 class="page-header-title">Skrill Time</h1>
          </div>
        </div>
        ${renderNoWeekBanner()}
      </div>`;
      return;
    }

    const revealed = week?.skrill_time_revealed ?? false;
    const total    = allProfiles.length;
    const count    = readyIds.size;
    const allReady = total > 0 && count >= total;
    const iReady   = readyIds.has(stored.id);
    const isSkDay  = isSkrillDay();

    const squares = allProfiles.map(p => `
      <div class="ready-square ${readyIds.has(p.id) ? 'on' : ''}" title="${p.name}"></div>
    `).join('');

    let readySection = '';
    if (!revealed) {
      if (!isSkDay) {
        readySection = `
          <div class="card" style="margin-bottom:20px">
            <div class="card-body countdown-wrap">
              <div id="countdown-subtext" class="countdown-dynamic-title"></div>
              <div class="countdown-row" id="countdown-display"></div>
              <div class="countdown-sub">Temporada ${week.week_number} · ${week.year}</div>
            </div>
          </div>`;
      } else {
        readySection = `
          <div class="card" style="margin-bottom:20px">
            <div class="card-body" style="padding:20px;text-align:center">
              <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px">
                ${squares}
              </div>
              <div style="font-size:28px;font-weight:700;color:var(--text-muted);margin-bottom:20px;text-transform:uppercase">
                ${count} / ${total} prontos
              </div>
              ${!iReady ? `
                <button class="btn btn-primary" style="font-size:26px;padding:14px 32px" onclick="markReady()">
                  Marcar Pronto
                </button>
              ` : `
                <div style="display:flex;flex-direction:column;align-items:center;gap:12px">
                  <div style="font-size:24px;color:var(--amber);font-weight:700;text-transform:uppercase">
                    Voce esta pronto! Aguardando os outros...
                  </div>
                  <button class="btn btn-ghost" style="font-size:22px;padding:10px 24px;opacity:0.7" onclick="unmarkReady()">
                    Desmarcar Pronto
                  </button>
                </div>
              `}
              ${allReady ? `<div style="font-size:24px;color:#22c55e;margin-top:12px;font-weight:700">Todos prontos! Revelando...</div>` : ''}
            </div>
          </div>`;
      }
    }

    const revealSection = revealed
      ? renderReveal()
      : `<div style="text-align:center;font-size:24px;color:var(--text-muted);text-transform:uppercase;padding:24px 0;border-top:1px solid var(--border)">
           Aguardando todos marcarem pronto para revelar os resultados
         </div>`;

    document.getElementById('app').innerHTML = `
      <div style="width:100%">
        <div class="page-header">
          <div>
            <div class="page-header-label">[S] Reuniao</div>
            <h1 class="page-header-title">Skrill Time</h1>
            ${week ? `<div style="font-size:24px;color:var(--text-muted);margin-top:6px;text-transform:uppercase;">
              Temporada ${week.week_number} · ${week.year}
            </div>` : ''}
          </div>
        </div>
        ${readySection}
        ${revealSection}
      </div>`;

    if (!revealed && !isSkDay) startCountdown();
  }

  function countdownLabel(diff) {
    const days  = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const mins  = Math.floor((diff % 3600000)  / 60000);
    if (days > 1)    return `faltam ${days} dias pro Skrill Day`;
    if (days === 1)  return `falta 1 dia pro Skrill Day`;
    if (hours > 1)   return `faltam ${hours} horas pro Skrill Day`;
    if (hours === 1) return `falta 1 hora pro Skrill Day`;
    if (mins > 1)    return `faltam ${mins} minutos pro Skrill Day`;
    if (mins === 1)  return `falta 1 minuto pro Skrill Day`;
    return `e ja ja e Skrill Day!`;
  }

  function startCountdown() {
    const target = new Date(currentWeek.end_date + 'T00:00:00');

    function tick() {
      const el  = document.getElementById('countdown-display');
      const sub = document.getElementById('countdown-subtext');
      if (!el) { clearInterval(countdownInterval); countdownInterval = null; return; }
      const diff = target - new Date();
      if (diff <= 0) {
        clearInterval(countdownInterval); countdownInterval = null;
        renderPage();
        return;
      }
      const days    = Math.floor(diff / 86400000);
      const hours   = Math.floor((diff % 86400000) / 3600000);
      const minutes = Math.floor((diff % 3600000)  / 60000);
      const seconds = Math.floor((diff % 60000)    / 1000);
      const pad     = n => String(n).padStart(2, '0');
      if (sub) sub.textContent = countdownLabel(diff);
      el.innerHTML = `
        <span class="cd-num">${pad(days)}</span>
        <span class="cd-sep">:</span>
        <span class="cd-num">${pad(hours)}</span>
        <span class="cd-sep">:</span>
        <span class="cd-num">${pad(minutes)}</span>
        <span class="cd-sep">:</span>
        <span class="cd-num">${pad(seconds)}</span>`;
    }
    tick();
    countdownInterval = setInterval(tick, 1000);
  }

  function renderReveal() {
    const completedGoals = weekGoals.filter(g =>
      (g.status === 'completed' || g.status === 'beyond') && participantIds.has(g.profile_id)
    );

    const byMember = new Map();
    for (const p of allProfiles) byMember.set(p.id, { profile: p, goals: [] });
    for (const g of completedGoals) {
      if (byMember.has(g.profile_id)) byMember.get(g.profile_id).goals.push(g);
    }

    const blocks = [...byMember.values()].map(({ profile, goals: mGoals }) => {
      const pts = mGoals.reduce((s, g) => s + (g.points_earned ?? 0), 0);
      const goalsHTML = mGoals.map(g => {
        const imgs = g.image_urls ?? [];
        return `
          <div style="margin-bottom:12px">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
              <span style="font-size:24px">${g.status === 'beyond' ? '[B]' : '[v]'}</span>
              <span style="font-size:24px;font-weight:700">${g.title}</span>
              <span class="badge ${g.status === 'beyond' ? 'badge-beyond' : 'badge-completed'}" style="margin-left:auto">${g.status === 'beyond' ? 'Beyond!' : 'Feito'}</span>
              ${g.points_earned > 0 ? `<span class="xp-earned">+${g.points_earned}pts</span>` : ''}
            </div>
            ${imgs.length ? `<div class="delivery-images">
              ${imgs.map(u => `<img class="reveal-img" src="${u}" alt="entrega">`).join('')}
            </div>` : ''}
          </div>`;
      }).join('');

      return `
        <div class="reveal-member-block" style="margin-bottom:16px">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border)">
            ${avatarHTML(profile, 'avatar-md')}
            <div style="flex:1">
              <div style="font-size:28px;font-weight:700">${profile.name}</div>
              <div style="font-size:24px;color:var(--text-muted)">${mGoals.length} meta${mGoals.length !== 1 ? 's' : ''} entregue${mGoals.length !== 1 ? 's' : ''}</div>
            </div>
            <div style="font-size:32px;font-weight:700;color:var(--amber)">${pts}pts</div>
          </div>
          ${mGoals.length ? goalsHTML : `<div style="font-size:24px;color:var(--text-muted);text-align:center;padding:8px">Nenhuma meta entregue esta temporada</div>`}
        </div>`;
    }).join('');

    const totalPts = completedGoals.reduce((s, g) => s + (g.points_earned ?? 0), 0);
    const nextNum  = currentWeek.week_number + 1;
    const nextYear = nextNum > 52 ? currentWeek.year + 1 : currentWeek.year;
    const nextDisp = nextNum > 52 ? 1 : nextNum;

    const advanceBtn = isAdmin() ? `
      <div style="margin-top:20px;padding-top:20px;border-top:2px dashed var(--border);text-align:center">
        <div style="font-size:22px;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase">
          Admin — Temporada ${currentWeek.week_number} concluida
        </div>
        <div style="font-size:20px;color:var(--text-muted);margin-bottom:14px">
          Clique para encerrar esta temporada e abrir a Temporada ${nextDisp} · ${nextYear} para todos.
        </div>
        <button class="btn btn-primary" style="font-size:24px;padding:12px 32px" onclick="openAdvanceWeekModal()">
          Encerrar e iniciar Temporada ${nextDisp}
        </button>
      </div>` : '';

    return `
      <div class="card">
        <div class="card-header">
          <div class="card-title">Resultados da Temporada</div>
          <div style="font-size:24px;font-weight:700;color:var(--amber)">${totalPts}pts total</div>
        </div>
        <div class="card-body" style="padding:16px">${blocks}</div>
      </div>
      ${advanceBtn}`;
  }

  function openAdvanceWeekModal() {
    const nextNum  = currentWeek.week_number + 1;
    const nextYear = nextNum > 52 ? currentWeek.year + 1 : currentWeek.year;
    const nextDisp = nextNum > 52 ? 1 : nextNum;

    const fmt    = d => d.toISOString().split('T')[0];
    const today  = new Date();
    const defEnd = new Date(today);
    defEnd.setDate(today.getDate() + 7);

    let overlay = document.getElementById('advance-week-modal');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'advance-week-modal';
      overlay.className = 'win-overlay hidden';
      overlay.addEventListener('click', e => { if (e.target === overlay) closeAdvanceWeekModal(); });
      document.body.appendChild(overlay);
    }

    overlay.innerHTML = `
      <div class="win-window" onclick="event.stopPropagation()" style="width:min(480px,92vw)">
        <div class="win-titlebar">
          <span class="win-titlebar-icon">[S]</span>
          <span class="win-titlebar-title">Encerrar Temporada ${currentWeek.week_number}</span>
          <button class="win-btn" onclick="closeAdvanceWeekModal()">X</button>
        </div>
        <div class="win-body" style="flex-direction:column;align-items:stretch;gap:16px;padding:20px 20px 16px">
          <div style="text-align:center;font-family:'Jersey 25',monospace;font-size:28px">
            Temporada ${nextDisp} · ${nextYear}
          </div>
          <div style="font-size:22px;color:#404040;text-align:center;border-bottom:1px solid #808080;padding-bottom:14px">
            Os pontos da temporada de todos serao zerados.
          </div>
          <div>
            <label style="display:block;font-size:20px;font-weight:700;margin-bottom:6px;font-family:'Micro 5',monospace;text-transform:uppercase;letter-spacing:.04em">
              Data final da Temporada ${nextDisp}
            </label>
            <input id="advance-end-date" type="date" value="${fmt(defEnd)}"
              style="width:100%;box-sizing:border-box;font-size:22px;padding:8px 10px;border:2px inset #808080;background:#fff;font-family:'Micro 5',monospace"/>
          </div>
        </div>
        <div class="win-statusbar" style="justify-content:flex-end;gap:8px;padding:8px 10px">
          <button class="btn btn-ghost btn-sm" style="font-size:20px" onclick="closeAdvanceWeekModal()">Cancelar</button>
          <button id="advance-confirm-btn" class="btn btn-primary btn-sm" style="font-size:20px" onclick="confirmAdvanceWeek(${nextDisp},${nextYear})">Confirmar</button>
        </div>
      </div>`;

    overlay.classList.remove('hidden');
  }

  function closeAdvanceWeekModal() {
    const overlay = document.getElementById('advance-week-modal');
    if (overlay) overlay.classList.add('hidden');
  }

  async function confirmAdvanceWeek(nextDisp, nextYear) {
    const endDate = document.getElementById('advance-end-date').value || null;
    const today   = new Date().toISOString().split('T')[0];

    const btn = document.getElementById('advance-confirm-btn');
    if (btn) { btn.disabled = true; btn.textContent = '...'; }

    await sb.from('weeks').update({ is_current: false }).eq('id', currentWeek.id);
    await sb.from('weeks').insert({
      week_number:          nextDisp,
      year:                 nextYear,
      start_date:           today,
      end_date:             endDate,
      is_current:           true,
      skrill_time_revealed: false,
    });
    await sb.from('profiles').update({ weekly_points: 0 }).not('id', 'is', null);

    closeAdvanceWeekModal();
    window.location.reload();
  }

  async function markReady() {
    if (!currentWeek) return;
    const btn = document.querySelector('[onclick="markReady()"]');
    if (btn) { btn.disabled = true; btn.textContent = '...'; }

    const { error } = await sb.from('week_ready').insert({
      week_id:    currentWeek.id,
      profile_id: stored.id,
    });

    if (error && !error.message.includes('duplicate')) {
      if (btn) { btn.disabled = false; btn.textContent = 'Marcar Pronto'; }
      return;
    }

    readyIds.add(stored.id);

    const { count } = await sb.from('week_ready')
      .select('*', { count: 'exact', head: true })
      .eq('week_id', currentWeek.id);

    if (count >= allProfiles.length && allProfiles.length > 0) {
      await sb.from('weeks').update({ skrill_time_revealed: true }).eq('id', currentWeek.id);
      currentWeek = { ...currentWeek, skrill_time_revealed: true };
      await awardPointsForAll();
    }

    renderPage();
  }

  async function unmarkReady() {
    if (!currentWeek) return;
    const btn = document.querySelector('[onclick="unmarkReady()"]');
    if (btn) { btn.disabled = true; btn.textContent = '...'; }

    await sb.from('week_ready')
      .delete()
      .eq('week_id', currentWeek.id)
      .eq('profile_id', stored.id);

    readyIds.delete(stored.id);
    renderPage();
  }

  async function awardPointsForAll() {
    const toAward = weekGoals.filter(g =>
      (g.status === 'completed' || g.status === 'beyond') && !g.points_awarded
      && participantIds.has(g.profile_id)
    );

    for (const g of toAward) {
      const pts = g.points_earned ?? (g.status === 'beyond' ? 8 : 5);

      await sb.from('goals').update({ points_awarded: true }).eq('id', g.id);

      await sb.from('point_history').insert({
        profile_id: g.profile_id,
        amount:     pts,
        reason:     g.status === 'beyond' ? 'beyond_scope' : 'complete_goal',
        goal_id:    g.id,
        week_id:    currentWeek.id,
      });

      const { data: prof } = await sb.from('profiles').select('total_points,weekly_points').eq('id', g.profile_id).single();
      if (prof) {
        await sb.from('profiles').update({
          total_points:  (prof.total_points  ?? 0) + pts,
          weekly_points: (prof.weekly_points ?? 0) + pts,
        }).eq('id', g.profile_id);
      }
    }
  }

  init();
  </script>
</body>
</html>

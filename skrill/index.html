<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SKRILL</title>
  <link rel="icon" type="image/x-icon" href="/skrill/favicon.ico"/>
  <link rel="stylesheet" href="/skrill/css/style.css"/>
</head>
<body>
  <div class="center-screen" style="min-height:100vh"><div class="spinner"></div></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/skrill/js/client.js"></script>
  <script>
    if (!isAppUnlocked()) {
      window.location.href = '/skrill/login/';
    } else {
      const p = getStoredProfile();
      window.location.href = p ? '/skrill/dashboard/' : '/skrill/select-profile/';
    }
  </script>
</body>
</html>
